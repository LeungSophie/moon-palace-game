<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Moon Palace TV</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: radial-gradient(circle at top, #313974, #101426 65%);
      color: white;
    }

    h1 {
      font-size: 56px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 34px;
      margin-top: 0;
    }

    #roomCode {
      font-size: 92px;
      font-weight: bold;
      letter-spacing: 16px;
      margin: 25px 0;
      color: #ffe89a;
    }

    #joinedCount {
      font-size: 30px;
      margin: 20px 0 30px;
    }

    #teamGrid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .teamCard {
      padding: 20px 10px;
      border-radius: 14px;
      font-size: 24px;
      font-weight: bold;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.2);
    }

    .joined {
      background: rgba(110, 220, 140, 0.2);
      border-color: rgba(110, 220, 140, 0.9);
    }

    .waiting {
      opacity: 0.55;
    }

    #status {
      font-size: 24px;
      margin-top: 30px;
    }

    #photoTestSection {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }

    #photoTestTitle {
      font-size: 28px;
      margin-bottom: 15px;
    }

    #photoTest {
      width: min(700px, 80vw);
      height: 360px;
      object-fit: contain;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.05);
    }

    #photoMessage {
      margin-top: 12px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>🌙 Moon Palace Adventure</h1>
  <h2>月宮大冒險</h2>

  <div id="roomCode">----</div>

  <div id="joinedCount">
    Waiting for teams...
  </div>

  <div id="teamGrid"></div>

  <div id="status">
    Waiting for host to create a room...
  </div>

  <section id="photoTestSection">
    <div id="photoTestTitle">
      Local Team Photo Test
    </div>

    <img
      id="photoTest"
      alt="Local team photo test"
      hidden
    >

    <div id="photoMessage">
      Waiting for a locally stored team photo...
    </div>
  </section>


  <script type="module">

    import {
      db,
      ref,
      onValue
    } from "./firebase.js";

    import {
      getTeamPhoto
    } from "./local-media.js";

    const photoChannel =
  new BroadcastChannel(
    "moon-palace-photos"
  );

    const roomCodeEl =
      document.getElementById("roomCode");

    const joinedCountEl =
      document.getElementById("joinedCount");

    const teamGrid =
      document.getElementById("teamGrid");

    const statusEl =
      document.getElementById("status");

    const photoTest =
      document.getElementById("photoTest");

    const photoMessage =
      document.getElementById("photoMessage");


    let activeRoomCode = null;


    const currentRoomRef =
      ref(db, "currentRoom");


    onValue(
      currentRoomRef,
      (snapshot) => {

        const roomCode =
          snapshot.val();

        activeRoomCode =
          roomCode || null;


        if (!roomCode) {

          roomCodeEl.textContent =
            "----";

          joinedCountEl.textContent =
            "Waiting for teams...";

          statusEl.textContent =
            "Waiting for host to create a room...";

          teamGrid.innerHTML =
            "";

          photoTest.hidden =
            true;

          photoMessage.textContent =
            "Waiting for a locally stored team photo...";

          return;
        }


        roomCodeEl.textContent =
          roomCode;

        statusEl.textContent =
          "Join using the room code above";

        watchTeams(
          roomCode
        );

      }
    );


    function watchTeams(roomCode) {

      const teamsRef =
        ref(
          db,
          "rooms/" +
          roomCode +
          "/teams"
        );


      onValue(
        teamsRef,
        async (snapshot) => {

          const teams =
            snapshot.val() || {};

          teamGrid.innerHTML =
            "";

          let joinedCount =
            0;


          for (
            let teamNumber = 1;
            teamNumber <= 10;
            teamNumber++
          ) {

            const teamKey =
              "team" + teamNumber;

            const joined =
              teams[teamKey] &&
              teams[teamKey].joined === true;


            if (joined) {
              joinedCount++;
            }


            const card =
              document.createElement("div");

            card.className =
              "teamCard " +
              (
                joined
                  ? "joined"
                  : "waiting"
              );


            card.textContent =
              joined
                ? "Team " +
                  teamNumber +
                  " ✓"
                : "Team " +
                  teamNumber;


            teamGrid.appendChild(
              card
            );

          }


          joinedCountEl.textContent =
            joinedCount +
            " / 10 teams joined";


          if (joinedCount === 10) {

            statusEl.textContent =
              "All teams are ready ✓";

          }


          await loadFirstAvailableTeamPhoto(
            roomCode,
            teams
          );

        }
      );

    }


    async function loadFirstAvailableTeamPhoto(
      roomCode,
      teams
    ) {

      photoTest.hidden =
        true;

      photoMessage.textContent =
        "Checking local team photos...";


      for (
        let teamNumber = 1;
        teamNumber <= 10;
        teamNumber++
      ) {

        const teamKey =
          "team" + teamNumber;


        const joined =
          teams[teamKey] &&
          teams[teamKey].joined === true;


        if (!joined) {
          continue;
        }


        const photoStorageKey =
          roomCode +
          "-" +
          teamKey;


        try {

          const photo =
            await getTeamPhoto(
              photoStorageKey
            );


          if (photo) {

            const photoURL =
              URL.createObjectURL(
                photo
              );


            photoTest.src =
              photoURL;

            photoTest.hidden =
              false;

            photoMessage.textContent =
              "Loaded local photo for Team " +
              teamNumber;

            return;

          }

        } catch (error) {

          console.error(
            "Could not load local team photo:",
            error
          );

        }

      }


      photoMessage.textContent =
        "No local team photo found yet.";

    }
photoChannel.addEventListener(
  "message",
  async (event) => {

    const data =
      event.data;

    if (
      !data ||
      data.type !== "photo-updated"
    ) {
      return;
    }

    if (
      data.roomCode !==
      activeRoomCode
    ) {
      return;
    }

    const teamNumber =
      Number(
        data.teamKey.replace(
          "team",
          ""
        )
      );

    const photoStorageKey =
      data.roomCode +
      "-" +
      data.teamKey;

    try {

      const photo =
        await getTeamPhoto(
          photoStorageKey
        );

      if (!photo) {
        return;
      }

      const photoURL =
        URL.createObjectURL(
          photo
        );

      photoTest.src =
        photoURL;

      photoTest.hidden =
        false;

      photoMessage.textContent =
        "Loaded local photo for Team " +
        teamNumber;

    } catch (error) {

      console.error(
        "Could not update TV photo:",
        error
      );

    }
  }
);
    
  </script>

</body>
</html>
