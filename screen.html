<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Moon Palace TV</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: radial-gradient(circle at top, #313974, #101426 65%);
      color: white;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 56px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 34px;
      margin-top: 0;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* LOBBY */

    #roomCode {
      font-size: 92px;
      font-weight: bold;
      letter-spacing: 16px;
      margin: 25px 0;
      color: #ffe89a;
    }

    #joinedCount {
      font-size: 30px;
      margin: 20px 0 30px;
    }

    #teamGrid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .teamCard {
      padding: 20px 10px;
      border-radius: 14px;
      font-size: 24px;
      font-weight: bold;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.2);
    }

    .joined {
      background: rgba(110,220,140,0.2);
      border-color: rgba(110,220,140,0.9);
    }

    .waiting {
      opacity: 0.55;
    }

    #status {
      font-size: 24px;
      margin-top: 30px;
    }

    /* PHOTO TEST */

    #photoTestSection {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }

    #photoTestTitle {
      font-size: 28px;
      margin-bottom: 15px;
    }

    #photoTest {
      width: min(700px, 80vw);
      height: 360px;
      object-fit: contain;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.05);
    }

    #photoMessage {
      margin-top: 12px;
      font-size: 20px;
    }

    /* INTRO */

    #introScreen {
      padding-top: 60px;
    }

    #introTitle {
      font-size: 70px;
      margin-bottom: 30px;
    }

    #introPlaceholder {
      max-width: 1100px;
      min-height: 470px;
      margin: 0 auto;
      border: 3px dashed rgba(255,255,255,0.35);
      border-radius: 24px;
      background: rgba(255,255,255,0.05);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 36px;
      line-height: 1.5;
    }

    /* QUESTIONS */

    #questionScreen {
      padding-top: 20px;
    }

    #questionNumber {
      font-size: 32px;
      opacity: 0.85;
      margin-bottom: 24px;
    }

    #questionChinese {
      font-size: 58px;
      font-weight: bold;
      line-height: 1.25;
      max-width: 1400px;
      margin: 0 auto 10px;
    }

    #questionEnglish {
      font-size: 38px;
      line-height: 1.3;
      max-width: 1400px;
      margin: 0 auto 28px;
      opacity: 0.92;
    }

    #questionImageArea {
      margin: 15px auto 28px;
    }

    #questionImage {
      max-width: 900px;
      max-height: 360px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 18px;
    }

    #answerGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .answerCard {
      min-height: 120px;
      padding: 18px 22px;
      border-radius: 18px;
      background: rgba(255,255,255,0.09);
      border: 2px solid rgba(255,255,255,0.18);
      text-align: left;
    }

    .answerLetter {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .answerChinese {
      font-size: 34px;
      font-weight: bold;
      line-height: 1.2;
    }

    .answerEnglish {
      font-size: 24px;
      line-height: 1.25;
      opacity: 0.9;
      margin-top: 5px;
    }

    #answeredStatus {
      font-size: 28px;
      margin-top: 24px;
    }

    #moonPowerArea {
      margin: 24px auto 0;
      max-width: 900px;
    }

    #moonPowerLabel {
      font-size: 28px;
      margin-bottom: 10px;
    }

    #moonPowerTrack {
      width: 100%;
      height: 28px;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      overflow: hidden;
    }

    #moonPowerFill {
      width: 0%;
      height: 100%;
      background: #ffe89a;
      transition: width 0.5s ease;
    }

    #moonPowerText {
      margin-top: 8px;
      font-size: 24px;
    }
  </style>
</head>

<body>

  <!-- LOBBY -->
  <section id="lobbyScreen" class="screen active">

    <h1>🌙 Moon Palace Adventure</h1>
    <h2>月宮大冒險</h2>

    <div id="roomCode">----</div>

    <div id="joinedCount">
      Waiting for teams...
    </div>

    <div id="teamGrid"></div>

    <div id="status">
      Waiting for host to create a room...
    </div>

    <section id="photoTestSection">

      <div id="photoTestTitle">
        Local Team Photo Test
      </div>

      <img
        id="photoTest"
        alt="Local team photo test"
        hidden
      >

      <div id="photoMessage">
        Waiting for a locally stored team photo...
      </div>

    </section>

  </section>


  <!-- INTRO -->
  <section id="introScreen" class="screen">

    <div id="introTitle">
      🌙 Moon Palace Adventure
    </div>

    <div id="introPlaceholder">
      INTRO VIDEO / SLIDESHOW
      <br><br>
      Placeholder
    </div>

  </section>


  <!-- QUESTIONS -->
  <section id="questionScreen" class="screen">

    <div id="questionNumber">
      QUESTION 1 / 10
    </div>

    <div id="questionChinese"></div>

    <div id="questionEnglish"></div>

    <div id="questionImageArea" hidden>
      <img
        id="questionImage"
        alt="Question diagram"
      >
    </div>

    <div id="answerGrid">

      <div class="answerCard" id="answerA">
        <div class="answerLetter">A</div>
        <div class="answerChinese"></div>
        <div class="answerEnglish"></div>
      </div>

      <div class="answerCard" id="answerB">
        <div class="answerLetter">B</div>
        <div class="answerChinese"></div>
        <div class="answerEnglish"></div>
      </div>

      <div class="answerCard" id="answerC">
        <div class="answerLetter">C</div>
        <div class="answerChinese"></div>
        <div class="answerEnglish"></div>
      </div>

      <div class="answerCard" id="answerD">
        <div class="answerLetter">D</div>
        <div class="answerChinese"></div>
        <div class="answerEnglish"></div>
      </div>

    </div>

    <div id="answeredStatus">
      0 / 0 teams answered
    </div>

    <div id="moonPowerArea">

      <div id="moonPowerLabel">
        🌕 Moon Power
      </div>

      <div id="moonPowerTrack">
        <div id="moonPowerFill"></div>
      </div>

      <div id="moonPowerText">
        0 / 1500
      </div>

    </div>

  </section>


  <script type="module">

    import {
      db,
      ref,
      onValue
    } from "./firebase.js";

    import {
      getTeamPhoto
    } from "./local-media.js";

    import {
      questions
    } from "./questions.js";


    const photoChannel =
      new BroadcastChannel(
        "moon-palace-photos"
      );


    const lobbyScreen =
      document.getElementById("lobbyScreen");

    const introScreen =
      document.getElementById("introScreen");

    const questionScreen =
      document.getElementById("questionScreen");


    const roomCodeEl =
      document.getElementById("roomCode");

    const joinedCountEl =
      document.getElementById("joinedCount");

    const teamGrid =
      document.getElementById("teamGrid");

    const statusEl =
      document.getElementById("status");

    const photoTest =
      document.getElementById("photoTest");

    const photoMessage =
      document.getElementById("photoMessage");


    const questionNumberEl =
      document.getElementById("questionNumber");

    const questionChineseEl =
      document.getElementById("questionChinese");

    const questionEnglishEl =
      document.getElementById("questionEnglish");

    const questionImageArea =
      document.getElementById("questionImageArea");

    const questionImage =
      document.getElementById("questionImage");

    const answeredStatus =
      document.getElementById("answeredStatus");

    const moonPowerFill =
      document.getElementById("moonPowerFill");

    const moonPowerText =
      document.getElementById("moonPowerText");


    let activeRoomCode = null;


    function showScreen(screenName) {

      lobbyScreen.classList.remove("active");
      introScreen.classList.remove("active");
      questionScreen.classList.remove("active");

      if (screenName === "lobby") {
        lobbyScreen.classList.add("active");
      }

      if (screenName === "intro") {
        introScreen.classList.add("active");
      }

      if (screenName === "questions") {
        questionScreen.classList.add("active");
      }
    }


    function renderQuestion(questionNumber, roomData) {

      const question =
        questions.find(
          q => q.id === questionNumber
        );

      if (!question) {
        questionChineseEl.textContent =
          "Question not found";

        questionEnglishEl.textContent =
          "";

        return;
      }


      questionNumberEl.textContent =
        "QUESTION " +
        questionNumber +
        " / 10";


      questionChineseEl.textContent =
        question.chinese;


      questionEnglishEl.textContent =
        question.english;


      const letters =
        ["A", "B", "C", "D"];


      for (const letter of letters) {

        const card =
          document.getElementById(
            "answer" + letter
          );

        card.querySelector(
          ".answerChinese"
        ).textContent =
          question.options[letter].chinese;

        card.querySelector(
          ".answerEnglish"
        ).textContent =
          question.options[letter].english;
      }


      if (question.image) {

        questionImage.src =
          question.image;

        questionImageArea.hidden =
          false;

      } else {

        questionImageArea.hidden =
          true;
      }


      const moonPower =
        roomData.moonPower || 0;


      const target =
        roomData.targetMoonPower || 1500;


      const percent =
        Math.min(
          100,
          (moonPower / target) * 100
        );


      moonPowerFill.style.width =
        percent + "%";


      moonPowerText.textContent =
        moonPower +
        " / " +
        target;


      answeredStatus.textContent =
        "0 / 0 teams answered";
    }


    const currentRoomRef =
      ref(
        db,
        "currentRoom"
      );


    onValue(
      currentRoomRef,
      (snapshot) => {

        const roomCode =
          snapshot.val();


        activeRoomCode =
          roomCode || null;


        if (!roomCode) {

          showScreen("lobby");

          roomCodeEl.textContent =
            "----";

          joinedCountEl.textContent =
            "Waiting for teams...";

          statusEl.textContent =
            "Waiting for host to create a room...";

          teamGrid.innerHTML =
            "";

          photoTest.hidden =
            true;

          photoMessage.textContent =
            "Waiting for a locally stored team photo...";

          return;
        }


        roomCodeEl.textContent =
          roomCode;


        statusEl.textContent =
          "Join using the room code above";


        watchRoom(
          roomCode
        );


        watchTeams(
          roomCode
        );

      }
    );


    function watchRoom(roomCode) {

      const roomRef =
        ref(
          db,
          "rooms/" +
          roomCode
        );


      onValue(
        roomRef,
        (snapshot) => {

          const room =
            snapshot.val();


          if (!room) {
            return;
          }


          const state =
            room.state || "lobby";


          if (state === "lobby") {

            showScreen(
              "lobby"
            );

          }


          if (state === "intro") {

            showScreen(
              "intro"
            );

          }


          if (state === "questions") {

            showScreen(
              "questions"
            );


            renderQuestion(
              room.currentQuestion || 1,
              room
            );

          }

        }
      );
    }


    function watchTeams(roomCode) {

      const teamsRef =
        ref(
          db,
          "rooms/" +
          roomCode +
          "/teams"
        );


      onValue(
        teamsRef,
        async (snapshot) => {

          const teams =
            snapshot.val() || {};


          teamGrid.innerHTML =
            "";


          let joinedCount =
            0;


          for (
            let teamNumber = 1;
            teamNumber <= 10;
            teamNumber++
          ) {

            const teamKey =
              "team" + teamNumber;


            const joined =
              teams[teamKey] &&
              teams[teamKey].joined === true;


            if (joined) {
              joinedCount++;
            }


            const card =
              document.createElement(
                "div"
              );


            card.className =
              "teamCard " +
              (
                joined
                  ? "joined"
                  : "waiting"
              );


            card.textContent =
              joined
                ? "Team " +
                  teamNumber +
                  " ✓"
                : "Team " +
                  teamNumber;


            teamGrid.appendChild(
              card
            );

          }


          joinedCountEl.textContent =
            joinedCount +
            " / 10 teams joined";


          if (joinedCount === 10) {

            statusEl.textContent =
              "All teams are ready ✓";

          } else {

            statusEl.textContent =
              "Waiting for teams to join...";

          }


          await loadFirstAvailableTeamPhoto(
            roomCode,
            teams
          );

        }
      );
    }


    async function loadFirstAvailableTeamPhoto(
      roomCode,
      teams
    ) {

      photoTest.hidden =
        true;


      photoMessage.textContent =
        "Checking local team photos...";


      for (
        let teamNumber = 1;
        teamNumber <= 10;
        teamNumber++
      ) {

        const teamKey =
          "team" + teamNumber;


        const joined =
          teams[teamKey] &&
          teams[teamKey].joined === true;


        if (!joined) {
          continue;
        }


        const photoStorageKey =
          roomCode +
          "-" +
          teamKey;


        try {

          const photo =
            await getTeamPhoto(
              photoStorageKey
            );


          if (photo) {

            const photoURL =
              URL.createObjectURL(
                photo
              );


            photoTest.src =
              photoURL;


            photoTest.hidden =
              false;


            photoMessage.textContent =
              "Loaded local photo for Team " +
              teamNumber;


            return;

          }

        } catch (error) {

          console.error(
            "Could not load local team photo:",
            error
          );

        }

      }


      photoMessage.textContent =
        "No local team photo found yet.";

    }


    photoChannel.addEventListener(
      "message",
      async (event) => {

        const data =
          event.data;


        if (
          !data ||
          data.type !== "photo-updated"
        ) {
          return;
        }


        if (
          data.roomCode !==
          activeRoomCode
        ) {
          return;
        }


        const teamNumber =
          Number(
            data.teamKey.replace(
              "team",
              ""
            )
          );


        const photoStorageKey =
          data.roomCode +
          "-" +
          data.teamKey;


        try {

          const photo =
            await getTeamPhoto(
              photoStorageKey
            );


          if (!photo) {
            return;
          }


          const photoURL =
            URL.createObjectURL(
              photo
            );


          photoTest.src =
            photoURL;


          photoTest.hidden =
            false;


          photoMessage.textContent =
            "Loaded local photo for Team " +
            teamNumber;


        } catch (error) {

          console.error(
            "Could not update TV photo:",
            error
          );

        }

      }
    );

  </script>

</body>
</html>
