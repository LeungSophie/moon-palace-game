<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Moon Palace Host</title>

  <style>
    body {
      margin: 0;
      padding: 28px;
      font-family: Arial, sans-serif;
      background: #11152b;
      color: white;
    }

    h1 {
      margin-top: 0;
    }

    button {
      font-size: 18px;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #topButtons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #roomCode {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 16px 0;
    }

    #teamList {
      margin-top: 25px;
      display: grid;
      gap: 12px;
    }

    .teamRow {
      display: grid;
      grid-template-columns: 110px 125px 170px 1fr;
      align-items: center;
      gap: 12px;

      padding: 12px;
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
    }

    .teamName {
      font-weight: bold;
      font-size: 18px;
    }

    .statusJoined {
      color: #8ff0a4;
    }

    .statusWaiting {
      color: #aaa;
    }

    input[type="number"] {
      width: 135px;
      font-size: 18px;
      padding: 8px;
      border-radius: 8px;
      border: none;
    }

    .photoArea {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .photoButton {
      font-size: 15px;
      padding: 9px 12px;
    }

    .photoPreview {
      width: 70px;
      height: 55px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.35);
    }

    .photoStatus {
      font-size: 14px;
      color: #8ff0a4;
    }

    #controls {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #playIntroButton {
      background: #d7cbff;
      color: #11152b;
      font-weight: bold;
    }

    #startButton {
      background: #ffe89a;
      color: #11152b;
      font-weight: bold;
    }

    #revealButton {
      background: #8ff0a4;
      color: #11152b;
      font-weight: bold;
    }

    #status {
      margin-top: 16px;
      font-size: 17px;
    }

    @media (max-width: 800px) {
      .teamRow {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>🌙 Moon Palace Host</h1>

  <div id="topButtons">

    <button id="createRoomButton">
      Create New Game Room
    </button>

    <button id="resetRoomButton">
      Reset / End Current Game
    </button>

  </div>


  <section id="roomSection" hidden>

    <p>Room Code</p>

    <div id="roomCode">
      ----
    </div>

    <p id="joinedCount">
      0 / 10 teams joined
    </p>

    <div id="teamList"></div>


    <div id="controls">

      <button id="playIntroButton" disabled>
        ▶ Play Intro
      </button>

      <button id="startButton" disabled>
        Skip Intro → Start Questions
      </button>

      <button id="revealButton" disabled>
        Reveal Answer Now
      </button>

    </div>

  </section>


  <p id="status"></p>


  <script type="module">

    import {
      db,
      ref,
      set,
      update,
      get,
      onValue
    } from "./firebase.js";


    import {
      saveTeamPhoto,
      getTeamPhoto
    } from "./local-media.js";


    import {
      questions
    } from "./questions.js";


    const photoChannel =
      new BroadcastChannel(
        "moon-palace-photos"
      );


    const createRoomButton =
      document.getElementById(
        "createRoomButton"
      );

    const resetRoomButton =
      document.getElementById(
        "resetRoomButton"
      );

    const roomSection =
      document.getElementById(
        "roomSection"
      );

    const roomCodeEl =
      document.getElementById(
        "roomCode"
      );

    const joinedCountEl =
      document.getElementById(
        "joinedCount"
      );

    const teamList =
      document.getElementById(
        "teamList"
      );

    const startButton =
      document.getElementById(
        "startButton"
      );

    const playIntroButton =
      document.getElementById(
        "playIntroButton"
      );

    const revealButton =
      document.getElementById(
        "revealButton"
      );

    const statusEl =
      document.getElementById(
        "status"
      );


    let currentRoomCode =
      null;

    let revealInProgress =
      false;

    let currentGameState =
      "none";


    /*
      Firebase listener cleanup.
    */

    let stopTeamsListener =
      null;

    let stopRoomListener =
      null;


    /* =========================
       ROOM CODE
    ========================== */

    function generateRoomCode() {

      return Math.floor(
        1000 +
        Math.random() * 9000
      ).toString();

    }


    function stopExistingListeners() {

      if (
        stopTeamsListener
      ) {

        stopTeamsListener();

        stopTeamsListener =
          null;

      }


      if (
        stopRoomListener
      ) {

        stopRoomListener();

        stopRoomListener =
          null;

      }

    }


    /* =========================
       CREATE ROOM
    ========================== */

    createRoomButton.addEventListener(
      "click",
      async () => {

        stopExistingListeners();


        const roomCode =
          generateRoomCode();


        currentRoomCode =
          roomCode;

        currentGameState =
          "lobby";

        revealInProgress =
          false;


        statusEl.textContent =
          "Creating room...";


        try {

          await set(
            ref(
              db,
              "rooms/" +
              roomCode
            ),
            {
              state: "lobby",
              moonPower: 0,
              targetMoonPower: 1500,
              currentQuestion: 0,
              createdAt: Date.now()
            }
          );


          await set(
            ref(
              db,
              "currentRoom"
            ),
            roomCode
          );


          roomCodeEl.textContent =
            roomCode;


          roomSection.hidden =
            false;


          revealButton.disabled =
            true;


          statusEl.textContent =
            "✅ Room created.";


          watchTeams(
            roomCode
          );


          watchRoomForAnswers(
            roomCode
          );


        } catch (
          error
        ) {

          console.error(
            error
          );


          statusEl.textContent =
            "❌ Error: " +
            error.message;

        }

      }
    );


    /* =========================
       WATCH TEAMS
    ========================== */

    function watchTeams(
      roomCode
    ) {

      const teamsRef =
        ref(
          db,
          "rooms/" +
          roomCode +
          "/teams"
        );


      stopTeamsListener =
        onValue(
          teamsRef,
          (
            snapshot
          ) => {

            const teams =
              snapshot.val() ||
              {};


            renderTeams(
              teams
            );

          }
        );

    }


    /* =========================
       WATCH ROOM / ANSWERS
    ========================== */

    function watchRoomForAnswers(
      roomCode
    ) {

      const roomRef =
        ref(
          db,
          "rooms/" +
          roomCode
        );


      stopRoomListener =
        onValue(
          roomRef,
          async (
            snapshot
          ) => {

            const room =
              snapshot.val();


            if (
              !room
            ) {

              return;

            }


            const state =
              room.state ||
              "lobby";


            currentGameState =
              state;


            /*
              Reveal button only works
              while a question is open.
            */

            if (
              state !==
              "questions"
            ) {

              revealButton.disabled =
                true;


              if (
                state ===
                "reveal"
              ) {

                const gain =
                  Number(
                    room.lastQuestionGain
                  ) || 0;


                statusEl.textContent =
                  "Answer revealed on TV. Moon Power +" +
                  gain +
                  ".";

              }


              revealInProgress =
                false;


              return;

            }


            revealButton.disabled =
              false;


            const teams =
              room.teams ||
              {};


            const activeTeamKeys =
              Object.keys(
                teams
              ).filter(
                teamKey =>
                  teams[
                    teamKey
                  ] &&
                  teams[
                    teamKey
                  ].joined ===
                    true
              );


            const activeTeamCount =
              activeTeamKeys.length;


            const questionNumber =
              room.currentQuestion ||
              1;


            const questionKey =
              "q" +
              questionNumber;


            const answers =
              (
                room.answers &&
                room.answers[
                  questionKey
                ]
              ) || {};


            const answeredCount =
              activeTeamKeys.filter(
                teamKey =>
                  answers[
                    teamKey
                  ]
              ).length;


            statusEl.textContent =
              "Question " +
              questionNumber +
              ": " +
              answeredCount +
              " / " +
              activeTeamCount +
              " answered";


            /*
              AUTOMATIC REVEAL

              When every active team
              has submitted an answer,
              reveal and score.
            */

            if (
              activeTeamCount > 0 &&
              answeredCount >=
                activeTeamCount &&
              !revealInProgress
            ) {

              revealInProgress =
                true;


              await revealCurrentQuestion(
                roomCode
              );

            }

          }
        );

    }


    /* =========================
       REVEAL + SCORE QUESTION
    ========================== */

    async function revealCurrentQuestion(
      roomCode
    ) {

      if (
        !roomCode
      ) {

        return;

      }


      try {

        const roomRef =
          ref(
            db,
            "rooms/" +
            roomCode
          );


        /*
          Read the latest room data
          before calculating scores.
        */

        const snapshot =
          await get(
            roomRef
          );


        if (
          !snapshot.exists()
        ) {

          revealInProgress =
            false;

          return;

        }


        const room =
          snapshot.val();


        const questionNumber =
          room.currentQuestion ||
          1;


        const questionKey =
          "q" +
          questionNumber;


        const question =
          questions.find(
            q =>
              q.id ===
              questionNumber
          );


        if (
          !question
        ) {

          revealInProgress =
            false;


          statusEl.textContent =
            "Question data not found.";


          return;

        }


        /*
          IMPORTANT PROTECTION

          If this question was already
          scored, do not award points
          again.
        */

        const alreadyScored =
          room.scoredQuestions &&
          room.scoredQuestions[
            questionKey
          ] === true;


        if (
          alreadyScored
        ) {

          await update(
            roomRef,
            {
              state:
                "reveal"
            }
          );


          revealButton.disabled =
            true;


          return;

        }


        const teams =
          room.teams ||
          {};


        const answers =
          (
            room.answers &&
            room.answers[
              questionKey
            ]
          ) || {};


        const correctAnswer =
          question.correctAnswer;


        let moonPowerGain =
          0;


        const updates =
          {};


        /*
          SCORE EACH ACTIVE TEAM
        */

        for (
          const [
            teamKey,
            teamData
          ]
          of Object.entries(
            teams
          )
        ) {

          if (
            !teamData ||
            teamData.joined !==
              true
          ) {

            continue;

          }


          const teamAnswer =
            answers[
              teamKey
            ]
              ? answers[
                  teamKey
                ].answer
              : "";


          const isCorrect =
            teamAnswer ===
            correctAnswer;


          const points =
            isCorrect
              ? 50
              : 0;


          const oldQuizScore =
            Number(
              teamData.quizScore
            ) || 0;


          const newQuizScore =
            oldQuizScore +
            points;


          moonPowerGain +=
            points;


          /*
            Update accumulated
            quiz score.
          */

          updates[
            "teams/" +
            teamKey +
            "/quizScore"
          ] =
            newQuizScore;


          /*
            Save detailed result for
            this question.

            Later play.html can use
            this to show +50 / +0.
          */

          updates[
            "results/" +
            questionKey +
            "/" +
            teamKey
          ] = {

            answer:
              teamAnswer,

            correct:
              isCorrect,

            points:
              points,

            quizScore:
              newQuizScore

          };

        }


        const currentMoonPower =
          Number(
            room.moonPower
          ) || 0;


        const newMoonPower =
          currentMoonPower +
          moonPowerGain;


        /*
          Mark question as scored.
        */

        updates[
          "scoredQuestions/" +
          questionKey
        ] =
          true;


        /*
          Store how much Moon Power
          this question added.
        */

        updates[
          "lastQuestionGain"
        ] =
          moonPowerGain;


        /*
          Update total Moon Power.
        */

        updates[
          "moonPower"
        ] =
          newMoonPower;


        /*
          Finally change game state
          to reveal.
        */

        updates[
          "state"
        ] =
          "reveal";


        /*
          Apply score updates,
          Moon Power and reveal
          together.
        */

        await update(
          roomRef,
          updates
        );


        revealButton.disabled =
          true;


        statusEl.textContent =
          "Answer revealed. Moon Power +" +
          moonPowerGain +
          ".";


      } catch (
        error
      ) {

        console.error(
          error
        );


        revealInProgress =
          false;


        statusEl.textContent =
          "Could not reveal answer: " +
          error.message;

      }

    }


    /* =========================
       MANUAL REVEAL
    ========================== */

    revealButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode ||
          currentGameState !==
            "questions"
        ) {

          return;

        }


        revealInProgress =
          true;


        revealButton.disabled =
          true;


        await revealCurrentQuestion(
          currentRoomCode
        );

      }
    );


    /* =========================
       RENDER TEAM LIST
    ========================== */

    async function renderTeams(
      teams
    ) {

      teamList.innerHTML =
        "";


      let joinedCount =
        0;


      for (
        let teamNumber = 1;
        teamNumber <= 10;
        teamNumber++
      ) {

        const teamKey =
          "team" +
          teamNumber;


        const teamData =
          teams[
            teamKey
          ] || {};


        const joined =
          teamData.joined ===
          true;


        if (
          joined
        ) {

          joinedCount++;

        }


        const row =
          document.createElement(
            "div"
          );


        row.className =
          "teamRow";


        /*
          TEAM NAME
        */

        const name =
          document.createElement(
            "div"
          );


        name.className =
          "teamName";


        name.textContent =
          "Team " +
          teamNumber;


        /*
          CONNECTION STATUS
        */

        const connectionStatus =
          document.createElement(
            "div"
          );


        connectionStatus.textContent =
          joined
            ? "● Connected"
            : "○ Waiting";


        connectionStatus.className =
          joined
            ? "statusJoined"
            : "statusWaiting";


        /*
          PREVIOUS ACTIVITY SCORE
        */

        const scoreArea =
          document.createElement(
            "div"
          );


        if (
          joined
        ) {

          const input =
            document.createElement(
              "input"
            );


          input.type =
            "number";

          input.min =
            "0";

          input.step =
            "1";

          input.placeholder =
            "Previous score";

          input.value =
            teamData.previousScore ??
            0;


          input.addEventListener(
            "change",
            async () => {

              const score =
                Math.max(
                  0,
                  Number(
                    input.value
                  ) || 0
                );


              await update(
                ref(
                  db,
                  "rooms/" +
                  currentRoomCode +
                  "/teams/" +
                  teamKey
                ),
                {
                  previousScore:
                    score
                }
              );

            }
          );


          scoreArea.appendChild(
            input
          );


        } else {

          scoreArea.textContent =
            "—";

        }


        /*
          TEAM PHOTO
        */

        const photoArea =
          document.createElement(
            "div"
          );


        photoArea.className =
          "photoArea";


        if (
          joined
        ) {

          const photoStorageKey =
            currentRoomCode +
            "-" +
            teamKey;


          const fileInput =
            document.createElement(
              "input"
            );


          fileInput.type =
            "file";

          fileInput.accept =
            "image/*";

          fileInput.hidden =
            true;


          const chooseButton =
            document.createElement(
              "button"
            );


          chooseButton.type =
            "button";

          chooseButton.className =
            "photoButton";

          chooseButton.textContent =
            "Choose Photo";


          const preview =
            document.createElement(
              "img"
            );


          preview.className =
            "photoPreview";

          preview.alt =
            "Team " +
            teamNumber +
            " photo";

          preview.hidden =
            true;


          const photoStatus =
            document.createElement(
              "span"
            );


          photoStatus.className =
            "photoStatus";


          chooseButton.addEventListener(
            "click",
            () => {

              fileInput.click();

            }
          );


          fileInput.addEventListener(
            "change",
            async () => {

              const file =
                fileInput.files[
                  0
                ];


              if (
                !file
              ) {

                return;

              }


              if (
                !file.type.startsWith(
                  "image/"
                )
              ) {

                alert(
                  "Please choose an image file."
                );


                return;

              }


              try {

                await saveTeamPhoto(
                  photoStorageKey,
                  file
                );


                photoChannel.postMessage(
                  {
                    type:
                      "photo-updated",

                    roomCode:
                      currentRoomCode,

                    teamKey:
                      teamKey
                  }
                );


                const previewURL =
                  URL.createObjectURL(
                    file
                  );


                preview.src =
                  previewURL;


                preview.hidden =
                  false;


                photoStatus.textContent =
                  "✓ Photo stored locally";


                chooseButton.textContent =
                  "Change Photo";


              } catch (
                error
              ) {

                console.error(
                  error
                );


                photoStatus.textContent =
                  "Photo could not be saved.";

              }

            }
          );


          /*
            Check existing local photo.
          */

          try {

            const savedPhoto =
              await getTeamPhoto(
                photoStorageKey
              );


            if (
              savedPhoto
            ) {

              const savedURL =
                URL.createObjectURL(
                  savedPhoto
                );


              preview.src =
                savedURL;


              preview.hidden =
                false;


              photoStatus.textContent =
                "✓ Photo stored locally";


              chooseButton.textContent =
                "Change Photo";

            }


          } catch (
            error
          ) {

            console.error(
              "Could not load stored photo:",
              error
            );

          }


          photoArea.appendChild(
            chooseButton
          );


          photoArea.appendChild(
            fileInput
          );


          photoArea.appendChild(
            preview
          );


          photoArea.appendChild(
            photoStatus
          );


        } else {

          photoArea.textContent =
            "—";

        }


        row.appendChild(
          name
        );


        row.appendChild(
          connectionStatus
        );


        row.appendChild(
          scoreArea
        );


        row.appendChild(
          photoArea
        );


        teamList.appendChild(
          row
        );

      }


      joinedCountEl.textContent =
        joinedCount +
        " / 10 teams joined";


      startButton.disabled =
        joinedCount ===
        0;


      playIntroButton.disabled =
        joinedCount ===
        0;


      /*
        Only show lobby team count
        while actually in lobby.

        Do not overwrite question /
        scoring status.
      */

      if (
        currentGameState ===
          "lobby" ||
        currentGameState ===
          "none"
      ) {

        if (
          joinedCount ===
          10
        ) {

          statusEl.textContent =
            "✅ All 10 teams are ready.";


        } else {

          statusEl.textContent =
            joinedCount +
            " team(s) currently connected.";

        }

      }

    }


    /* =========================
       PLAY INTRO
    ========================== */

    playIntroButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode
        ) {

          return;

        }


        await update(
          ref(
            db,
            "rooms/" +
            currentRoomCode
          ),
          {
            state:
              "intro"
          }
        );


        currentGameState =
          "intro";


        statusEl.textContent =
          "Intro playing on TV.";

      }
    );


    /* =========================
       START QUESTIONS
    ========================== */

    startButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode
        ) {

          return;

        }


        revealInProgress =
          false;


        await update(
          ref(
            db,
            "rooms/" +
            currentRoomCode
          ),
          {
            state:
              "questions",

            currentQuestion:
              1
          }
        );


        currentGameState =
          "questions";


        statusEl.textContent =
          "Questions started.";

      }
    );


    /* =========================
       RESET / END GAME
    ========================== */

    resetRoomButton.addEventListener(
      "click",
      async () => {

        const confirmed =
          confirm(
            "End the current game and return the TV to the waiting screen?"
          );


        if (
          !confirmed
        ) {

          return;

        }


        try {

          await set(
            ref(
              db,
              "currentRoom"
            ),
            null
          );


          stopExistingListeners();


          currentRoomCode =
            null;

          currentGameState =
            "none";

          revealInProgress =
            false;


          roomSection.hidden =
            true;


          roomCodeEl.textContent =
            "----";


          joinedCountEl.textContent =
            "0 / 10 teams joined";


          teamList.innerHTML =
            "";


          startButton.disabled =
            true;


          playIntroButton.disabled =
            true;


          revealButton.disabled =
            true;


          statusEl.textContent =
            "Current game ended. Ready to create a new room.";


        } catch (
          error
        ) {

          console.error(
            error
          );


          statusEl.textContent =
            "❌ Error: " +
            error.message;

        }

      }
    );

  </script>

</body>
</html>
