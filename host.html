<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Moon Palace Host</title>

  <style>

    body {
      margin: 0;
      padding: 28px;
      font-family: Arial, sans-serif;
      background: #11152b;
      color: white;
    }

    h1 {
      margin-top: 0;
    }

    button {
      font-size: 18px;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }


    #topButtons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }


    #roomCode {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 16px 0;
    }


    #teamList {
      margin-top: 25px;
      display: grid;
      gap: 12px;
    }


    .teamRow {
      display: grid;
      grid-template-columns:
        110px
        125px
        170px
        1fr;

      align-items: center;
      gap: 12px;

      padding: 12px;

      background:
        rgba(255,255,255,0.07);

      border-radius: 10px;
    }


    .teamName {
      font-weight: bold;
      font-size: 18px;
    }


    .statusJoined {
      color: #8ff0a4;
    }


    .statusWaiting {
      color: #aaa;
    }


    input[type="number"] {
      width: 135px;
      font-size: 18px;
      padding: 8px;

      border-radius: 8px;
      border: none;
    }


    .photoArea {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }


    .photoButton {
      font-size: 15px;
      padding: 9px 12px;
    }


    .photoPreview {
      width: 70px;
      height: 55px;

      object-fit: cover;

      border-radius: 8px;

      border:
        2px solid
        rgba(255,255,255,0.35);
    }


    .photoStatus {
      font-size: 14px;
      color: #8ff0a4;
    }


    #controls {
      margin-top: 28px;

      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }


    #playIntroButton {
      background: #d7cbff;
      color: #11152b;
      font-weight: bold;
    }


    #startButton {
      background: #ffe89a;
      color: #11152b;
      font-weight: bold;
    }


    #revealButton {
      background: #8ff0a4;
      color: #11152b;
      font-weight: bold;
    }


    #nextQuestionButton {
      background: #8dd9ff;
      color: #11152b;
      font-weight: bold;
    }


    #status {
      margin-top: 16px;
      font-size: 17px;
      line-height: 1.5;
    }


    @media (max-width: 800px) {

      .teamRow {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>

  <h1>
    🌙 Moon Palace Host
  </h1>


  <div id="topButtons">

    <button id="createRoomButton">
      Create New Game Room
    </button>


    <button id="resetRoomButton">
      Reset / End Current Game
    </button>

  </div>



  <section
    id="roomSection"
    hidden
  >

    <p>
      Room Code
    </p>


    <div id="roomCode">
      ----
    </div>


    <p id="joinedCount">
      0 / 10 teams joined
    </p>


    <div id="teamList"></div>



    <div id="controls">


      <button
        id="playIntroButton"
        disabled
      >
        ▶ Play Intro
      </button>


      <button
        id="startButton"
        disabled
      >
        Skip Intro → Start Questions
      </button>


      <button
        id="revealButton"
        disabled
      >
        Reveal Answer Now
      </button>


      <button
        id="nextQuestionButton"
        disabled
      >
        Next Question →
      </button>


    </div>

  </section>


  <p id="status"></p>



  <script type="module">


    /* =========================
       FIREBASE
    ========================== */

    import {
      db,
      ref,
      set,
      update,
      get,
      onValue
    } from "./firebase.js";


    /* =========================
       LOCAL TEAM PHOTOS
    ========================== */

    import {
      saveTeamPhoto,
      getTeamPhoto
    } from "./local-media.js";


    /* =========================
       QUESTION DATA
    ========================== */

    import {
      questions
    } from "./questions.js";



    const photoChannel =
      new BroadcastChannel(
        "moon-palace-photos"
      );



    /* =========================
       ELEMENTS
    ========================== */

    const createRoomButton =
      document.getElementById(
        "createRoomButton"
      );


    const resetRoomButton =
      document.getElementById(
        "resetRoomButton"
      );


    const roomSection =
      document.getElementById(
        "roomSection"
      );


    const roomCodeEl =
      document.getElementById(
        "roomCode"
      );


    const joinedCountEl =
      document.getElementById(
        "joinedCount"
      );


    const teamList =
      document.getElementById(
        "teamList"
      );


    const playIntroButton =
      document.getElementById(
        "playIntroButton"
      );


    const startButton =
      document.getElementById(
        "startButton"
      );


    const revealButton =
      document.getElementById(
        "revealButton"
      );


    const nextQuestionButton =
      document.getElementById(
        "nextQuestionButton"
      );


    const statusEl =
      document.getElementById(
        "status"
      );



    /* =========================
       GAME VARIABLES
    ========================== */

    let currentRoomCode =
      null;


    let currentGameState =
      "none";


    let revealInProgress =
      false;


    let stopTeamsListener =
      null;


    let stopRoomListener =
      null;



    /* =========================
       ROOM CODE
    ========================== */

    function generateRoomCode() {

      return Math.floor(
        1000 +
        Math.random() * 9000
      ).toString();

    }



    /* =========================
       STOP OLD LISTENERS
    ========================== */

    function stopExistingListeners() {

      if (
        stopTeamsListener
      ) {

        stopTeamsListener();

        stopTeamsListener =
          null;

      }


      if (
        stopRoomListener
      ) {

        stopRoomListener();

        stopRoomListener =
          null;

      }

    }



    /* =========================
       CREATE ROOM
    ========================== */

    createRoomButton.addEventListener(
      "click",
      async () => {


        stopExistingListeners();


        const roomCode =
          generateRoomCode();


        currentRoomCode =
          roomCode;


        currentGameState =
          "lobby";


        revealInProgress =
          false;


        nextQuestionButton.textContent =
          "Next Question →";


        statusEl.textContent =
          "Creating room...";


        try {


          await set(
            ref(
              db,
              "rooms/" +
              roomCode
            ),
            {

              state:
                "lobby",

              moonPower:
                0,

              targetMoonPower:
                1500,

              currentQuestion:
                0,

              totalQuestions:
                questions.length,

              createdAt:
                Date.now()

            }
          );


          await set(
            ref(
              db,
              "currentRoom"
            ),
            roomCode
          );


          roomCodeEl.textContent =
            roomCode;


          roomSection.hidden =
            false;


          revealButton.disabled =
            true;


          nextQuestionButton.disabled =
            true;


          statusEl.textContent =
            "✅ Room created.";


          watchTeams(
            roomCode
          );


          watchRoomForAnswers(
            roomCode
          );


        } catch (
          error
        ) {


          console.error(
            error
          );


          statusEl.textContent =
            "❌ Error: " +
            error.message;

        }

      }
    );



    /* =========================
       WATCH TEAMS
    ========================== */

    function watchTeams(
      roomCode
    ) {


      const teamsRef =
        ref(
          db,
          "rooms/" +
          roomCode +
          "/teams"
        );


      stopTeamsListener =
        onValue(
          teamsRef,
          (
            snapshot
          ) => {


            const teams =
              snapshot.val() ||
              {};


            renderTeams(
              teams
            );

          }
        );

    }



    /* =========================
       WATCH ROOM / ANSWERS
    ========================== */

    function watchRoomForAnswers(
      roomCode
    ) {


      const roomRef =
        ref(
          db,
          "rooms/" +
          roomCode
        );


      stopRoomListener =
        onValue(
          roomRef,
          async (
            snapshot
          ) => {


            const room =
              snapshot.val();


            if (
              !room
            ) {

              return;

            }


            const state =
              room.state ||
              "lobby";


            currentGameState =
              state;



            /* =====================
               NOT IN OPEN QUESTION
            ===================== */

            if (
              state !==
              "questions"
            ) {


              revealButton.disabled =
                true;



              /* =====================
                 ANSWER REVEAL
              ===================== */

              if (
                state ===
                "reveal"
              ) {


                const gain =
                  Number(
                    room.lastQuestionGain
                  ) || 0;


                const questionNumber =
                  Number(
                    room.currentQuestion
                  ) || 1;



                /*
                  If final question
                  has finished.
                */

                if (
                  questionNumber >=
                  questions.length
                ) {


                  nextQuestionButton.disabled =
                    true;


                  nextQuestionButton.textContent =
                    "Quiz Complete ✓";


                  statusEl.textContent =
                    "Question " +
                    questionNumber +
                    " revealed. Moon Power +" +
                    gain +
                    ". All " +
                    questions.length +
                    " questions are complete.";


                } else {


                  nextQuestionButton.disabled =
                    false;


                  nextQuestionButton.textContent =
                    "Next Question →";


                  statusEl.textContent =
                    "Question " +
                    questionNumber +
                    " revealed. Moon Power +" +
                    gain +
                    ". Ready for next question.";

                }


              } else {


                nextQuestionButton.disabled =
                  true;


                nextQuestionButton.textContent =
                  "Next Question →";

              }


              revealInProgress =
                false;


              return;

            }



            /* =====================
               QUESTION IS OPEN
            ===================== */


            revealButton.disabled =
              false;


            nextQuestionButton.disabled =
              true;


            nextQuestionButton.textContent =
              "Next Question →";



            const teams =
              room.teams ||
              {};


            const activeTeamKeys =
              Object.keys(
                teams
              ).filter(
                teamKey =>

                  teams[
                    teamKey
                  ] &&

                  teams[
                    teamKey
                  ].joined ===
                    true
              );


            const activeTeamCount =
              activeTeamKeys.length;



            const questionNumber =
              Number(
                room.currentQuestion
              ) || 1;



            const questionKey =
              "q" +
              questionNumber;



            const answers =
              (
                room.answers &&
                room.answers[
                  questionKey
                ]
              ) || {};



            const answeredCount =
              activeTeamKeys.filter(
                teamKey =>
                  answers[
                    teamKey
                  ]
              ).length;



            statusEl.textContent =
              "Question " +
              questionNumber +
              " / " +
              questions.length +
              ": " +
              answeredCount +
              " / " +
              activeTeamCount +
              " answered";



            /* =====================
               AUTOMATIC REVEAL
            ===================== */

            if (

              activeTeamCount >
                0 &&

              answeredCount >=
                activeTeamCount &&

              !revealInProgress

            ) {


              revealInProgress =
                true;


              await revealCurrentQuestion(
                roomCode
              );

            }

          }
        );

    }



    /* =========================
       REVEAL + SCORE QUESTION
    ========================== */

    async function revealCurrentQuestion(
      roomCode
    ) {


      if (
        !roomCode
      ) {

        return;

      }


      try {


        const roomRef =
          ref(
            db,
            "rooms/" +
            roomCode
          );



        const snapshot =
          await get(
            roomRef
          );


        if (
          !snapshot.exists()
        ) {


          revealInProgress =
            false;


          return;

        }



        const room =
          snapshot.val();



        const questionNumber =
          Number(
            room.currentQuestion
          ) || 1;



        const questionKey =
          "q" +
          questionNumber;



        const question =
          questions.find(
            q =>
              q.id ===
              questionNumber
          );



        if (
          !question
        ) {


          revealInProgress =
            false;


          statusEl.textContent =
            "Question " +
            questionNumber +
            " was not found in questions.js.";


          return;

        }



        /* =====================
           PREVENT DOUBLE SCORING
        ===================== */

        const alreadyScored =
          room.scoredQuestions &&
          room.scoredQuestions[
            questionKey
          ] ===
            true;



        if (
          alreadyScored
        ) {


          await update(
            roomRef,
            {
              state:
                "reveal"
            }
          );


          revealButton.disabled =
            true;


          return;

        }



        const teams =
          room.teams ||
          {};


        const answers =
          (
            room.answers &&
            room.answers[
              questionKey
            ]
          ) || {};



        const correctAnswer =
          question.correctAnswer;



        let moonPowerGain =
          0;



        const updates =
          {};



        /* =====================
           SCORE ACTIVE TEAMS
        ===================== */

        for (
          const [
            teamKey,
            teamData
          ]
          of Object.entries(
            teams
          )
        ) {


          if (

            !teamData ||

            teamData.joined !==
              true

          ) {

            continue;

          }



          const teamAnswer =
            answers[
              teamKey
            ]
              ? answers[
                  teamKey
                ].answer
              : "";



          const isCorrect =
            teamAnswer ===
            correctAnswer;



          const points =
            isCorrect
              ? 50
              : 0;



          const oldQuizScore =
            Number(
              teamData.quizScore
            ) || 0;



          const newQuizScore =
            oldQuizScore +
            points;



          moonPowerGain +=
            points;



          /* TEAM QUIZ SCORE */

          updates[
            "teams/" +
            teamKey +
            "/quizScore"
          ] =
            newQuizScore;



          /* QUESTION RESULT */

          updates[
            "results/" +
            questionKey +
            "/" +
            teamKey
          ] = {


            answer:
              teamAnswer,


            correct:
              isCorrect,


            points:
              points,


            quizScore:
              newQuizScore

          };

        }



        /* =====================
           MOON POWER
        ===================== */

        const currentMoonPower =
          Number(
            room.moonPower
          ) || 0;



        const newMoonPower =
          currentMoonPower +
          moonPowerGain;



        updates[
          "moonPower"
        ] =
          newMoonPower;



        updates[
          "lastQuestionGain"
        ] =
          moonPowerGain;



        /* =====================
           MARK QUESTION SCORED
        ===================== */

        updates[
          "scoredQuestions/" +
          questionKey
        ] =
          true;



        /* =====================
           REVEAL
        ===================== */

        updates[
          "state"
        ] =
          "reveal";



        /*
          Score + Moon Power +
          results + reveal are written
          together.
        */

        await update(
          roomRef,
          updates
        );



        revealButton.disabled =
          true;



        statusEl.textContent =
          "Answer revealed. Moon Power +" +
          moonPowerGain +
          ".";



      } catch (
        error
      ) {


        console.error(
          error
        );


        revealInProgress =
          false;


        statusEl.textContent =
          "Could not reveal answer: " +
          error.message;

      }

    }



    /* =========================
       MANUAL REVEAL
    ========================== */

    revealButton.addEventListener(
      "click",
      async () => {


        if (

          !currentRoomCode ||

          currentGameState !==
            "questions"

        ) {

          return;

        }



        revealInProgress =
          true;



        revealButton.disabled =
          true;



        await revealCurrentQuestion(
          currentRoomCode
        );

      }
    );



    /* =========================
       NEXT QUESTION
    ========================== */

    nextQuestionButton.addEventListener(
      "click",
      async () => {


        if (

          !currentRoomCode ||

          currentGameState !==
            "reveal"

        ) {

          return;

        }



        nextQuestionButton.disabled =
          true;



        try {


          const roomRef =
            ref(
              db,
              "rooms/" +
              currentRoomCode
            );



          const snapshot =
            await get(
              roomRef
            );



          if (
            !snapshot.exists()
          ) {

            nextQuestionButton.disabled =
              false;


            return;

          }



          const room =
            snapshot.val();



          const currentQuestion =
            Number(
              room.currentQuestion
            ) || 1;



          const nextQuestion =
            currentQuestion +
            1;



          /* =====================
             CHECK NEXT QUESTION
          ===================== */

          const nextQuestionExists =
            questions.some(
              q =>
                q.id ===
                nextQuestion
            );



          if (
            !nextQuestionExists
          ) {


            nextQuestionButton.disabled =
              true;


            nextQuestionButton.textContent =
              "Quiz Complete ✓";


            statusEl.textContent =
              "All " +
              questions.length +
              " questions are complete.";


            return;

          }



          revealInProgress =
            false;



          await update(
            roomRef,
            {

              state:
                "questions",

              currentQuestion:
                nextQuestion,

              lastQuestionGain:
                0

            }
          );



          currentGameState =
            "questions";



          nextQuestionButton.textContent =
            "Next Question →";



          statusEl.textContent =
            "Question " +
            nextQuestion +
            " started.";



        } catch (
          error
        ) {


          console.error(
            error
          );


          nextQuestionButton.disabled =
            false;


          statusEl.textContent =
            "Could not start next question: " +
            error.message;

        }

      }
    );



    /* =========================
       RENDER TEAM LIST
    ========================== */

    async function renderTeams(
      teams
    ) {


      teamList.innerHTML =
        "";



      let joinedCount =
        0;



      for (
        let teamNumber = 1;
        teamNumber <= 10;
        teamNumber++
      ) {


        const teamKey =
          "team" +
          teamNumber;



        const teamData =
          teams[
            teamKey
          ] || {};



        const joined =
          teamData.joined ===
          true;



        if (
          joined
        ) {

          joinedCount++;

        }



        const row =
          document.createElement(
            "div"
          );


        row.className =
          "teamRow";



        /* =====================
           TEAM NAME
        ===================== */

        const name =
          document.createElement(
            "div"
          );


        name.className =
          "teamName";


        name.textContent =
          "Team " +
          teamNumber;



        /* =====================
           CONNECTION STATUS
        ===================== */

        const connectionStatus =
          document.createElement(
            "div"
          );


        connectionStatus.textContent =
          joined
            ? "● Connected"
            : "○ Waiting";


        connectionStatus.className =
          joined
            ? "statusJoined"
            : "statusWaiting";



        /* =====================
           PREVIOUS SCORE
        ===================== */

        const scoreArea =
          document.createElement(
            "div"
          );



        if (
          joined
        ) {


          const input =
            document.createElement(
              "input"
            );


          input.type =
            "number";


          input.min =
            "0";


          input.step =
            "1";


          input.placeholder =
            "Previous score";


          input.value =
            teamData.previousScore ??
            0;



          input.addEventListener(
            "change",
            async () => {


              const score =
                Math.max(
                  0,
                  Number(
                    input.value
                  ) || 0
                );



              await update(
                ref(
                  db,
                  "rooms/" +
                  currentRoomCode +
                  "/teams/" +
                  teamKey
                ),
                {
                  previousScore:
                    score
                }
              );

            }
          );


          scoreArea.appendChild(
            input
          );


        } else {


          scoreArea.textContent =
            "—";

        }



        /* =====================
           TEAM PHOTO
        ===================== */

        const photoArea =
          document.createElement(
            "div"
          );


        photoArea.className =
          "photoArea";



        if (
          joined
        ) {


          const photoStorageKey =
            currentRoomCode +
            "-" +
            teamKey;



          const fileInput =
            document.createElement(
              "input"
            );


          fileInput.type =
            "file";


          fileInput.accept =
            "image/*";


          fileInput.hidden =
            true;



          const chooseButton =
            document.createElement(
              "button"
            );


          chooseButton.type =
            "button";


          chooseButton.className =
            "photoButton";


          chooseButton.textContent =
            "Choose Photo";



          const preview =
            document.createElement(
              "img"
            );


          preview.className =
            "photoPreview";


          preview.alt =
            "Team " +
            teamNumber +
            " photo";


          preview.hidden =
            true;



          const photoStatus =
            document.createElement(
              "span"
            );


          photoStatus.className =
            "photoStatus";



          chooseButton.addEventListener(
            "click",
            () => {

              fileInput.click();

            }
          );



          fileInput.addEventListener(
            "change",
            async () => {


              const file =
                fileInput.files[
                  0
                ];



              if (
                !file
              ) {

                return;

              }



              if (
                !file.type.startsWith(
                  "image/"
                )
              ) {


                alert(
                  "Please choose an image file."
                );


                return;

              }



              try {


                await saveTeamPhoto(
                  photoStorageKey,
                  file
                );



                photoChannel.postMessage(
                  {

                    type:
                      "photo-updated",

                    roomCode:
                      currentRoomCode,

                    teamKey:
                      teamKey

                  }
                );



                const previewURL =
                  URL.createObjectURL(
                    file
                  );



                preview.src =
                  previewURL;



                preview.hidden =
                  false;



                photoStatus.textContent =
                  "✓ Photo stored locally";



                chooseButton.textContent =
                  "Change Photo";



              } catch (
                error
              ) {


                console.error(
                  error
                );


                photoStatus.textContent =
                  "Photo could not be saved.";

              }

            }
          );



          /* =====================
             EXISTING PHOTO
          ===================== */

          try {


            const savedPhoto =
              await getTeamPhoto(
                photoStorageKey
              );



            if (
              savedPhoto
            ) {


              const savedURL =
                URL.createObjectURL(
                  savedPhoto
                );



              preview.src =
                savedURL;



              preview.hidden =
                false;



              photoStatus.textContent =
                "✓ Photo stored locally";



              chooseButton.textContent =
                "Change Photo";

            }



          } catch (
            error
          ) {


            console.error(
              "Could not load stored photo:",
              error
            );

          }



          photoArea.appendChild(
            chooseButton
          );


          photoArea.appendChild(
            fileInput
          );


          photoArea.appendChild(
            preview
          );


          photoArea.appendChild(
            photoStatus
          );



        } else {


          photoArea.textContent =
            "—";

        }



        row.appendChild(
          name
        );


        row.appendChild(
          connectionStatus
        );


        row.appendChild(
          scoreArea
        );


        row.appendChild(
          photoArea
        );



        teamList.appendChild(
          row
        );

      }



      joinedCountEl.textContent =
        joinedCount +
        " / 10 teams joined";



      startButton.disabled =
        joinedCount ===
        0;



      playIntroButton.disabled =
        joinedCount ===
        0;



      /*
        Don't overwrite the live
        question/reveal status.
      */

      if (

        currentGameState ===
          "lobby" ||

        currentGameState ===
          "none"

      ) {


        if (
          joinedCount ===
          10
        ) {


          statusEl.textContent =
            "✅ All 10 teams are ready.";


        } else {


          statusEl.textContent =
            joinedCount +
            " team(s) currently connected.";

        }

      }

    }



    /* =========================
       PLAY INTRO
    ========================== */

    playIntroButton.addEventListener(
      "click",
      async () => {


        if (
          !currentRoomCode
        ) {

          return;

        }



        await update(
          ref(
            db,
            "rooms/" +
            currentRoomCode
          ),
          {

            state:
              "intro"

          }
        );



        currentGameState =
          "intro";



        revealButton.disabled =
          true;



        nextQuestionButton.disabled =
          true;



        statusEl.textContent =
          "Intro playing on TV.";

      }
    );



    /* =========================
       START QUESTION 1
    ========================== */

    startButton.addEventListener(
      "click",
      async () => {


        if (
          !currentRoomCode
        ) {

          return;

        }



        if (
          questions.length ===
          0
        ) {


          statusEl.textContent =
            "No questions found in questions.js.";


          return;

        }



        revealInProgress =
          false;



        const firstQuestionId =
          questions[
            0
          ].id;



        await update(
          ref(
            db,
            "rooms/" +
            currentRoomCode
          ),
          {

            state:
              "questions",

            currentQuestion:
              firstQuestionId

          }
        );



        currentGameState =
          "questions";



        nextQuestionButton.disabled =
          true;



        statusEl.textContent =
          "Question " +
          firstQuestionId +
          " started.";

      }
    );



    /* =========================
       RESET / END GAME
    ========================== */

    resetRoomButton.addEventListener(
      "click",
      async () => {


        const confirmed =
          confirm(
            "End the current game and return the TV to the waiting screen?"
          );



        if (
          !confirmed
        ) {

          return;

        }



        try {


          await set(
            ref(
              db,
              "currentRoom"
            ),
            null
          );



          stopExistingListeners();



          currentRoomCode =
            null;



          currentGameState =
            "none";



          revealInProgress =
            false;



          roomSection.hidden =
            true;



          roomCodeEl.textContent =
            "----";



          joinedCountEl.textContent =
            "0 / 10 teams joined";



          teamList.innerHTML =
            "";



          playIntroButton.disabled =
            true;



          startButton.disabled =
            true;



          revealButton.disabled =
            true;



          nextQuestionButton.disabled =
            true;



          nextQuestionButton.textContent =
            "Next Question →";



          statusEl.textContent =
            "Current game ended. Ready to create a new room.";



        } catch (
          error
        ) {


          console.error(
            error
          );


          statusEl.textContent =
            "❌ Error: " +
            error.message;

        }

      }
    );


  </script>

</body>
</html>
