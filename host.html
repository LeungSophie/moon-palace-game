<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Palace Host</title>
</head>

<body>
  <h1>Moon Palace Host</h1>

  <p>Firebase connection test</p>

  <button id="testButton">Send Test Message</button>

  <p id="status">Not sent yet.</p>

  <script type="module">
    import {
      db,
      ref,
      set
    } from "./firebase.js";

    const testButton = document.getElementById("testButton");
    const status = document.getElementById("status");

    testButton.addEventListener("click", async () => {
      status.textContent = "Sending...";

      try {
        await set(ref(db, "test/message"), {
          text: "Hello from Moon Palace Host!",
          time: Date.now()
        });

        status.textContent = "✅ Message sent to Firebase!";
      } catch (error) {
        console.error(error);
        status.textContent = "❌ Error: " + error.message;
      }
    });
  </script>
</body>
</html>
