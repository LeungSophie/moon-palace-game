<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Moon Palace Host</title>

  <style>
    body {
      margin: 0;
      padding: 28px;
      font-family: Arial, sans-serif;
      background: #11152b;
      color: white;
    }

    h1 {
      margin-top: 0;
    }

    button {
      font-size: 18px;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    #topButtons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #roomCode {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 16px 0;
    }

    #teamList {
      margin-top: 25px;
      display: grid;
      gap: 12px;
    }

    .teamRow {
      display: grid;
      grid-template-columns: 110px 125px 170px 1fr;
      align-items: center;
      gap: 12px;

      padding: 12px;
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
    }

    .teamName {
      font-weight: bold;
      font-size: 18px;
    }

    .statusJoined {
      color: #8ff0a4;
    }

    .statusWaiting {
      color: #aaa;
    }

    input[type="number"] {
      width: 135px;
      font-size: 18px;
      padding: 8px;
      border-radius: 8px;
      border: none;
    }

    .photoArea {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .photoButton {
      font-size: 15px;
      padding: 9px 12px;
    }

    .photoPreview {
      width: 70px;
      height: 55px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.35);
    }

    .photoStatus {
      font-size: 14px;
      color: #8ff0a4;
    }

    #controls {
      margin-top: 28px;
    }

    #startButton {
      background: #ffe89a;
      color: #11152b;
      font-weight: bold;
    }

    #status {
      margin-top: 16px;
      font-size: 17px;
    }

    @media (max-width: 800px) {
      .teamRow {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>🌙 Moon Palace Host</h1>

  <div id="topButtons">

    <button id="createRoomButton">
      Create New Game Room
    </button>

    <button id="resetRoomButton">
      Reset / End Current Game
    </button>

  </div>


  <section id="roomSection" hidden>

    <p>Room Code</p>

    <div id="roomCode">----</div>

    <p id="joinedCount">
      0 / 10 teams joined
    </p>

    <div id="teamList"></div>

    <div id="controls">

  <button id="playIntroButton" disabled>
    ▶ Play Intro
  </button>

  <button id="startButton" disabled>
    Skip Intro → Start Questions
  </button>

</div>

  </section>

  <p id="status"></p>


  <script type="module">

    import {
      db,
      ref,
      set,
      update,
      onValue
    } from "./firebase.js";


    import {
      saveTeamPhoto,
      getTeamPhoto
    } from "./local-media.js";

const photoChannel =
  new BroadcastChannel(
    "moon-palace-photos"
  );
    const createRoomButton =
      document.getElementById("createRoomButton");

    const resetRoomButton =
      document.getElementById("resetRoomButton");

    const roomSection =
      document.getElementById("roomSection");

    const roomCodeEl =
      document.getElementById("roomCode");

    const joinedCountEl =
      document.getElementById("joinedCount");

    const teamList =
      document.getElementById("teamList");

    const startButton =
      document.getElementById("startButton");

const playIntroButton =
  document.getElementById("playIntroButton");
    
    const statusEl =
      document.getElementById("status");


    let currentRoomCode = null;


    function generateRoomCode() {
      return Math.floor(
        1000 + Math.random() * 9000
      ).toString();
    }


    createRoomButton.addEventListener(
      "click",
      async () => {

        const roomCode =
          generateRoomCode();

        currentRoomCode =
          roomCode;

        statusEl.textContent =
          "Creating room...";

        try {

          await set(
            ref(db, "rooms/" + roomCode),
            {
              state: "lobby",
              moonPower: 0,
              targetMoonPower: 1500,
              currentQuestion: 0,
              createdAt: Date.now()
            }
          );

          await set(
            ref(db, "currentRoom"),
            roomCode
          );

          roomCodeEl.textContent =
            roomCode;

          roomSection.hidden =
            false;

          statusEl.textContent =
            "✅ Room created.";

          watchTeams();

        } catch (error) {

          console.error(error);

          statusEl.textContent =
            "❌ Error: " + error.message;

        }
      }
    );


    function watchTeams() {

      const teamsRef =
        ref(
          db,
          "rooms/" +
          currentRoomCode +
          "/teams"
        );

      onValue(
        teamsRef,
        (snapshot) => {

          const teams =
            snapshot.val() || {};

          renderTeams(teams);

        }
      );
    }


    async function renderTeams(teams) {

      teamList.innerHTML = "";

      let joinedCount = 0;


      for (
        let teamNumber = 1;
        teamNumber <= 10;
        teamNumber++
      ) {

        const teamKey =
          "team" + teamNumber;

        const teamData =
          teams[teamKey] || {};

        const joined =
          teamData.joined === true;


        if (joined) {
          joinedCount++;
        }


        const row =
          document.createElement("div");

        row.className =
          "teamRow";


        // TEAM NAME
        const name =
          document.createElement("div");

        name.className =
          "teamName";

        name.textContent =
          "Team " + teamNumber;


        // CONNECTION STATUS
        const connectionStatus =
          document.createElement("div");

        connectionStatus.textContent =
          joined
            ? "● Connected"
            : "○ Waiting";

        connectionStatus.className =
          joined
            ? "statusJoined"
            : "statusWaiting";


        // PREVIOUS ACTIVITY SCORE
        const scoreArea =
          document.createElement("div");


        if (joined) {

          const input =
            document.createElement("input");

          input.type =
            "number";

          input.min =
            "0";

          input.step =
            "1";

          input.placeholder =
            "Previous score";

          input.value =
            teamData.previousScore ?? 0;


          input.addEventListener(
            "change",
            async () => {

              const score =
                Math.max(
                  0,
                  Number(input.value) || 0
                );

              await update(
                ref(
                  db,
                  "rooms/" +
                  currentRoomCode +
                  "/teams/" +
                  teamKey
                ),
                {
                  previousScore: score
                }
              );

            }
          );

          scoreArea.appendChild(input);

        } else {

          scoreArea.textContent = "—";

        }


        // TEAM PHOTO
        const photoArea =
          document.createElement("div");

        photoArea.className =
          "photoArea";


        if (joined) {

          const photoStorageKey =
            currentRoomCode +
            "-" +
            teamKey;


          const fileInput =
            document.createElement("input");

          fileInput.type = "file";
          fileInput.accept = "image/*";
          fileInput.hidden = true;


          const chooseButton =
            document.createElement("button");

          chooseButton.type = "button";
          chooseButton.className =
            "photoButton";

          chooseButton.textContent =
            "Choose Photo";


          const preview =
            document.createElement("img");

          preview.className =
            "photoPreview";

          preview.alt =
            "Team " +
            teamNumber +
            " photo";

          preview.hidden = true;


          const photoStatus =
            document.createElement("span");

          photoStatus.className =
            "photoStatus";


          chooseButton.addEventListener(
            "click",
            () => {

              fileInput.click();

            }
          );


          fileInput.addEventListener(
            "change",
            async () => {

              const file =
                fileInput.files[0];

              if (!file) {
                return;
              }


              if (
                !file.type.startsWith(
                  "image/"
                )
              ) {

                alert(
                  "Please choose an image file."
                );

                return;
              }


              try {

                await saveTeamPhoto(
                  photoStorageKey,
                  file
                );

                photoChannel.postMessage({
  type: "photo-updated",
  roomCode: currentRoomCode,
  teamKey: teamKey
});

                const previewURL =
                  URL.createObjectURL(file);

                preview.src =
                  previewURL;

                preview.hidden =
                  false;

                photoStatus.textContent =
                  "✓ Photo stored locally";

                chooseButton.textContent =
                  "Change Photo";


              } catch (error) {

                console.error(error);

                photoStatus.textContent =
                  "Photo could not be saved.";

              }

            }
          );


          // Check whether this team already
          // has a locally stored photo.
          try {

            const savedPhoto =
              await getTeamPhoto(
                photoStorageKey
              );


            if (savedPhoto) {

              const savedURL =
                URL.createObjectURL(
                  savedPhoto
                );

              preview.src =
                savedURL;

              preview.hidden =
                false;

              photoStatus.textContent =
                "✓ Photo stored locally";

              chooseButton.textContent =
                "Change Photo";

            }

          } catch (error) {

            console.error(
              "Could not load stored photo:",
              error
            );

          }


          photoArea.appendChild(
            chooseButton
          );

          photoArea.appendChild(
            fileInput
          );

          photoArea.appendChild(
            preview
          );

          photoArea.appendChild(
            photoStatus
          );

        } else {

          photoArea.textContent = "—";

        }


        row.appendChild(name);

        row.appendChild(
          connectionStatus
        );

        row.appendChild(
          scoreArea
        );

        row.appendChild(
          photoArea
        );


        teamList.appendChild(row);
      }


      joinedCountEl.textContent =
        joinedCount +
        " / 10 teams joined";


      startButton.disabled =
  joinedCount === 0;

playIntroButton.disabled =
  joinedCount === 0;

      if (joinedCount === 10) {

        statusEl.textContent =
          "✅ All 10 teams are ready.";

      } else {

        statusEl.textContent =
          joinedCount +
          " team(s) currently connected.";

      }

    }

    playIntroButton.addEventListener(
  "click",
  async () => {

    if (!currentRoomCode) {
      return;
    }

    await update(
      ref(
        db,
        "rooms/" +
        currentRoomCode
      ),
      {
        state: "intro"
      }
    );

    statusEl.textContent =
      "Intro playing on TV.";

  }
);

    startButton.addEventListener(
      "click",
      async () => {

        if (!currentRoomCode) {
          return;
        }


        await update(
          ref(
            db,
            "rooms/" +
            currentRoomCode
          ),
          {
            state: "questions",
            currentQuestion: 1
          }
        );


        statusEl.textContent =
          "Questions started.";

      }
    );


    resetRoomButton.addEventListener(
      "click",
      async () => {

        const confirmed =
          confirm(
            "End the current game and return the TV to the waiting screen?"
          );


        if (!confirmed) {
          return;
        }


        try {

          await set(
            ref(db, "currentRoom"),
            null
          );


          currentRoomCode = null;

          roomSection.hidden =
            true;

          roomCodeEl.textContent =
            "----";

          joinedCountEl.textContent =
            "0 / 10 teams joined";

          teamList.innerHTML =
            "";

          startButton.disabled =
            true;

          playIntroButton.disabled =
  true;
          
          statusEl.textContent =
            "Current game ended. Ready to create a new room.";


        } catch (error) {

          console.error(error);

          statusEl.textContent =
            "❌ Error: " +
            error.message;

        }
      }
    );

  </script>

</body>
</html>
