<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Moon Palace Host</title>

  <style>

    body {
      margin: 0;
      padding: 28px;
      font-family: Arial, sans-serif;
      background: #11152b;
      color: white;
    }

    h1 {
      margin-top: 0;
    }

    button {
      font-size: 18px;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #topButtons,
    #controls,
    #leaderboardControls,
    #finaleControls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #roomCode {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 16px 0;
    }

    #teamList {
      margin-top: 25px;
      display: grid;
      gap: 12px;
    }

    .teamRow {
      display: grid;

      grid-template-columns:
        110px
        125px
        170px
        1fr;

      align-items: center;
      gap: 12px;

      padding: 12px;

      background:
        rgba(255,255,255,0.07);

      border-radius: 10px;
    }

    .teamName {
      font-weight: bold;
      font-size: 18px;
    }

    .statusJoined {
      color: #8ff0a4;
    }

    .statusWaiting {
      color: #aaa;
    }

    input[type="number"] {
      width: 135px;
      font-size: 18px;
      padding: 8px;

      border-radius: 8px;
      border: none;
    }

    .photoArea {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .photoButton {
      font-size: 15px;
      padding: 9px 12px;
    }

    .photoPreview {
      width: 70px;
      height: 55px;

      object-fit: cover;

      border-radius: 8px;

      border:
        2px solid
        rgba(255,255,255,0.35);
    }

    .photoStatus {
      font-size: 14px;
      color: #8ff0a4;
    }

    #controls {
      margin-top: 28px;
    }

    #leaderboardControls {
      margin-top: 16px;
    }

    #finaleControls {
      margin-top: 16px;
    }

    #playIntroButton {
      background: #d7cbff;
      color: #11152b;
      font-weight: bold;
    }

    #startButton {
      background: #ffe89a;
      color: #11152b;
      font-weight: bold;
    }

    #revealButton {
      background: #8ff0a4;
      color: #11152b;
      font-weight: bold;
    }

    #nextQuestionButton {
      background: #8dd9ff;
      color: #11152b;
      font-weight: bold;
    }

    #finishQuizButton {
      background: #ffcf70;
      color: #11152b;
      font-weight: bold;
    }

    #startLeaderboardButton {
      background: #e1b7ff;
      color: #11152b;
      font-weight: bold;
    }

    #revealRankButton {
      background: #ff9fd0;
      color: #11152b;
      font-weight: bold;
    }

    #showFullLeaderboardButton {
      background: #ffd76e;
      color: #11152b;
      font-weight: bold;
    }

    #playFinaleButton {
      background: #fff0a6;
      color: #11152b;
      font-weight: bold;
      font-size: 20px;
    }

    #status {
      margin-top: 18px;
      font-size: 18px;
      line-height: 1.5;
    }

    @media (max-width: 800px) {

      .teamRow {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>

  <h1>
    🌙 Moon Palace Host
  </h1>


  <div id="topButtons">

    <button id="createRoomButton">
      Create New Game Room
    </button>

    <button id="resetRoomButton">
      Reset / End Current Game
    </button>

  </div>


  <section
    id="roomSection"
    hidden
  >

    <p>
      Room Code
    </p>


    <div id="roomCode">
      ----
    </div>


    <p id="joinedCount">
      0 / 10 teams joined
    </p>


    <div id="teamList"></div>


    <div id="controls">

      <button
        id="playIntroButton"
        disabled
      >
        ▶ Play Intro
      </button>


      <button
        id="startButton"
        disabled
      >
        Skip Intro → Start Questions
      </button>


      <button
        id="revealButton"
        disabled
      >
        Reveal Answer Now
      </button>


      <button
        id="nextQuestionButton"
        disabled
      >
        Next Question →
      </button>


      <button
        id="finishQuizButton"
        disabled
      >
        Finish Quiz →
      </button>

    </div>


    <div id="leaderboardControls">

      <button
        id="startLeaderboardButton"
        disabled
      >
        🏆 Start Final Leaderboard
      </button>


      <button
        id="revealRankButton"
        disabled
      >
        Reveal Next Rank
      </button>


      <button
        id="showFullLeaderboardButton"
        disabled
      >
        Show Full Leaderboard
      </button>

    </div>


    <div id="finaleControls">

      <button
        id="playFinaleButton"
        disabled
      >
        ▶ Play Finale
      </button>

    </div>

  </section>


  <p id="status"></p>


  <script type="module">

    import {
      db,
      ref,
      set,
      update,
      get,
      onValue
    } from "./firebase.js";


    import {
      saveTeamPhoto,
      getTeamPhoto
    } from "./local-media.js";


    import {
      questions
    } from "./questions.js";


    const photoChannel =
      new BroadcastChannel(
        "moon-palace-photos"
      );


    const createRoomButton =
      document.getElementById(
        "createRoomButton"
      );

    const resetRoomButton =
      document.getElementById(
        "resetRoomButton"
      );

    const roomSection =
      document.getElementById(
        "roomSection"
      );

    const roomCodeEl =
      document.getElementById(
        "roomCode"
      );

    const joinedCountEl =
      document.getElementById(
        "joinedCount"
      );

    const teamList =
      document.getElementById(
        "teamList"
      );

    const playIntroButton =
      document.getElementById(
        "playIntroButton"
      );

    const startButton =
      document.getElementById(
        "startButton"
      );

    const revealButton =
      document.getElementById(
        "revealButton"
      );

    const nextQuestionButton =
      document.getElementById(
        "nextQuestionButton"
      );

    const finishQuizButton =
      document.getElementById(
        "finishQuizButton"
      );

    const startLeaderboardButton =
      document.getElementById(
        "startLeaderboardButton"
      );

    const revealRankButton =
      document.getElementById(
        "revealRankButton"
      );

    const showFullLeaderboardButton =
      document.getElementById(
        "showFullLeaderboardButton"
      );

    const playFinaleButton =
      document.getElementById(
        "playFinaleButton"
      );

    const statusEl =
      document.getElementById(
        "status"
      );


    let currentRoomCode =
      null;

    let currentGameState =
      "none";

    let currentJoinedCount =
      0;

    let revealInProgress =
      false;

    let stopTeamsListener =
      null;

    let stopRoomListener =
      null;


    function generateRoomCode() {

      return Math.floor(
        1000 +
        Math.random() * 9000
      ).toString();

    }


    function stopExistingListeners() {

      if (
        stopTeamsListener
      ) {

        stopTeamsListener();

        stopTeamsListener =
          null;

      }


      if (
        stopRoomListener
      ) {

        stopRoomListener();

        stopRoomListener =
          null;

      }

    }


    function updatePrimaryButtons() {

      const hasTeams =
        currentJoinedCount > 0;


      playIntroButton.disabled =
        !(
          hasTeams &&
          currentGameState ===
            "lobby"
        );


      startButton.disabled =
        !(
          hasTeams &&
          (
            currentGameState ===
              "lobby" ||

            currentGameState ===
              "intro"
          )
        );

    }


    function resetLeaderboardButtons() {

      startLeaderboardButton.disabled =
        true;


      revealRankButton.disabled =
        true;


      showFullLeaderboardButton.disabled =
        true;


      playFinaleButton.disabled =
        true;


      revealRankButton.textContent =
        "Reveal Next Rank";

    }



    /* ==========================================
       CREATE ROOM
    ========================================== */

    createRoomButton.addEventListener(
      "click",
      async () => {

        stopExistingListeners();


        const roomCode =
          generateRoomCode();


        currentRoomCode =
          roomCode;


        currentGameState =
          "lobby";


        currentJoinedCount =
          0;


        revealInProgress =
          false;


        statusEl.textContent =
          "Creating room...";


        try {

          await set(
            ref(
              db,
              "rooms/" +
              roomCode
            ),
            {
              state:
                "lobby",

              moonPower:
                0,

              targetMoonPower:
                1500,

              moonPowerComplete:
                false,

              moonPowerCompletedByHost:
                false,

              currentQuestion:
                0,

              totalQuestions:
                questions.length,

              quizCompleted:
                false,

              createdAt:
                Date.now()
            }
          );


          await set(
            ref(
              db,
              "currentRoom"
            ),
            roomCode
          );


          roomCodeEl.textContent =
            roomCode;


          roomSection.hidden =
            false;


          revealButton.disabled =
            true;


          nextQuestionButton.disabled =
            true;


          finishQuizButton.disabled =
            true;


          resetLeaderboardButtons();


          nextQuestionButton.textContent =
            "Next Question →";


          finishQuizButton.textContent =
            "Finish Quiz →";


          playFinaleButton.textContent =
            "▶ Play Finale";


          statusEl.textContent =
            "✅ Room created.";


          updatePrimaryButtons();


          watchTeams(
            roomCode
          );


          watchRoomForAnswers(
            roomCode
          );


        } catch (
          error
        ) {

          console.error(
            error
          );


          statusEl.textContent =
            "❌ Error: " +
            error.message;

        }

      }
    );



    /* ==========================================
       WATCH TEAMS
    ========================================== */

    function watchTeams(
      roomCode
    ) {

      const teamsRef =
        ref(
          db,
          "rooms/" +
          roomCode +
          "/teams"
        );


      stopTeamsListener =
        onValue(
          teamsRef,
          (
            snapshot
          ) => {

            const teams =
              snapshot.val() ||
              {};


            renderTeams(
              teams
            );

          }
        );

    }



    /* ==========================================
       WATCH ROOM
    ========================================== */

    function watchRoomForAnswers(
      roomCode
    ) {

      const roomRef =
        ref(
          db,
          "rooms/" +
          roomCode
        );


      stopRoomListener =
        onValue(
          roomRef,
          async (
            snapshot
          ) => {

            const room =
              snapshot.val();


            if (
              !room
            ) {

              return;

            }


            const state =
              room.state ||
              "lobby";


            currentGameState =
              state;


            updatePrimaryButtons();



            /* LOBBY */

            if (
              state ===
              "lobby"
            ) {

              revealButton.disabled =
                true;


              nextQuestionButton.disabled =
                true;


              finishQuizButton.disabled =
                true;


              resetLeaderboardButtons();


              revealInProgress =
                false;


              return;

            }



            /* INTRO */

            if (
              state ===
              "intro"
            ) {

              revealButton.disabled =
                true;


              nextQuestionButton.disabled =
                true;


              finishQuizButton.disabled =
                true;


              resetLeaderboardButtons();


              revealInProgress =
                false;


              statusEl.textContent =
                "Intro playing on TV.";


              return;

            }



            /* QUIZ COMPLETE */

            if (
              state ===
              "quizComplete"
            ) {

              revealButton.disabled =
                true;


              nextQuestionButton.disabled =
                true;


              finishQuizButton.disabled =
                true;


              startLeaderboardButton.disabled =
                false;


              revealRankButton.disabled =
                true;


              showFullLeaderboardButton.disabled =
                true;


              playFinaleButton.disabled =
                true;


              revealInProgress =
                false;


              statusEl.textContent =
                "🌕 Quiz complete. Ready to start the Final Leaderboard.";


              return;

            }



            /* PROGRESSIVE LEADERBOARD */

            if (
              state ===
              "leaderboard"
            ) {

              revealButton.disabled =
                true;


              nextQuestionButton.disabled =
                true;


              finishQuizButton.disabled =
                true;


              startLeaderboardButton.disabled =
                true;


              showFullLeaderboardButton.disabled =
                true;


              playFinaleButton.disabled =
                true;


              const revealOrder =
                Array.isArray(
                  room.leaderboardRevealOrder
                )
                  ? room.leaderboardRevealOrder
                  : [];


              const step =
                Number(
                  room.leaderboardStep
                ) || 0;


              const totalSteps =
                revealOrder.length;


              if (
                step <
                totalSteps
              ) {

                revealRankButton.disabled =
                  false;


                const nextRank =
                  revealOrder[
                    step
                  ];


                revealRankButton.textContent =
                  "Reveal Rank " +
                  nextRank;


                statusEl.textContent =
                  step +
                  " / " +
                  totalSteps +
                  " rank groups revealed. Next: Rank " +
                  nextRank +
                  ".";


              } else {

                revealRankButton.disabled =
                  true;


                revealRankButton.textContent =
                  "Champion Revealed ✓";


                showFullLeaderboardButton.disabled =
                  false;


                statusEl.textContent =
                  "🏆 Champion revealed. Ready to show the full leaderboard.";

              }


              return;

            }



            /* FULL LEADERBOARD */

            if (
              state ===
              "leaderboardFull"
            ) {

              revealButton.disabled =
                true;


              nextQuestionButton.disabled =
                true;


              finishQuizButton.disabled =
                true;


              startLeaderboardButton.disabled =
                true;


              revealRankButton.disabled =
                true;


              showFullLeaderboardButton.disabled =
                true;


              playFinaleButton.disabled =
                false;


              playFinaleButton.textContent =
                "▶ Play Finale";


              statusEl.textContent =
                "🏆 Full Final Leaderboard is displayed. When ready, play the finale.";


              return;

            }



            /* FINALE */

            if (
              state ===
              "finale"
            ) {

              revealButton.disabled =
                true;


              nextQuestionButton.disabled =
                true;


              finishQuizButton.disabled =
                true;


              startLeaderboardButton.disabled =
                true;


              revealRankButton.disabled =
                true;


              showFullLeaderboardButton.disabled =
                true;


              playFinaleButton.disabled =
                true;


              playFinaleButton.textContent =
                "Finale Playing ✓";


              statusEl.textContent =
                "🌕 Finale is playing on the TV.";


              return;

            }



            /* ANSWER REVEAL */

            if (
              state ===
              "reveal"
            ) {

              revealButton.disabled =
                true;


              resetLeaderboardButtons();


              revealInProgress =
                false;


              const gain =
                Number(
                  room.lastQuestionGain
                ) || 0;


              const questionNumber =
                Number(
                  room.currentQuestion
                ) || 1;


              const rawMoonPower =
                Number(
                  room.moonPower
                ) || 0;


              const target =
                Number(
                  room.targetMoonPower
                ) || 1500;


              const moonPowerComplete =
                room.moonPowerComplete ===
                  true ||
                rawMoonPower >=
                  target;


              const isLastQuestion =
                questionNumber >=
                questions.length;



              if (
                moonPowerComplete &&
                !isLastQuestion
              ) {

                nextQuestionButton.disabled =
                  false;


                nextQuestionButton.textContent =
                  "Continue Questions →";


                finishQuizButton.disabled =
                  false;


                finishQuizButton.textContent =
                  "Finish Quiz →";


                statusEl.textContent =
                  "🌕 MOON POWER COMPLETE! " +
                  rawMoonPower +
                  " / " +
                  target +
                  ". Continue the quiz or finish now.";


                return;

              }



              if (
                moonPowerComplete &&
                isLastQuestion
              ) {

                nextQuestionButton.disabled =
                  true;


                nextQuestionButton.textContent =
                  "No More Questions";


                finishQuizButton.disabled =
                  false;


                finishQuizButton.textContent =
                  "Finish Quiz →";


                statusEl.textContent =
                  "🌕 All questions complete. Moon Power target achieved. Press Finish Quiz.";


                return;

              }



              if (
                !moonPowerComplete &&
                isLastQuestion
              ) {

                nextQuestionButton.disabled =
                  true;


                nextQuestionButton.textContent =
                  "No More Questions";


                finishQuizButton.disabled =
                  false;


                finishQuizButton.textContent =
                  "Complete Moon Power & Finish →";


                statusEl.textContent =
                  "All questions complete. Moon Power: " +
                  rawMoonPower +
                  " / " +
                  target +
                  ". Complete the Moon Power without changing team scores.";


                return;

              }



              nextQuestionButton.disabled =
                false;


              nextQuestionButton.textContent =
                "Next Question →";


              finishQuizButton.disabled =
                true;


              finishQuizButton.textContent =
                "Finish Quiz →";


              statusEl.textContent =
                "Question " +
                questionNumber +
                " revealed. Moon Power +" +
                gain +
                ". Total: " +
                rawMoonPower +
                " / " +
                target +
                ".";


              return;

            }



            /* QUESTION OPEN */

            if (
              state !==
              "questions"
            ) {

              return;

            }


            revealButton.disabled =
              false;


            nextQuestionButton.disabled =
              true;


            finishQuizButton.disabled =
              true;


            resetLeaderboardButtons();


            const teams =
              room.teams ||
              {};


            const activeTeamKeys =
              Object.keys(
                teams
              ).filter(
                teamKey =>
                  teams[
                    teamKey
                  ] &&
                  teams[
                    teamKey
                  ].joined ===
                    true
              );


            const activeTeamCount =
              activeTeamKeys.length;


            const questionNumber =
              Number(
                room.currentQuestion
              ) || 1;


            const questionKey =
              "q" +
              questionNumber;


            const answers =
              (
                room.answers &&
                room.answers[
                  questionKey
                ]
              ) || {};


            const answeredCount =
              activeTeamKeys.filter(
                teamKey =>
                  answers[
                    teamKey
                  ]
              ).length;


            statusEl.textContent =
              "Question " +
              questionNumber +
              " / " +
              questions.length +
              ": " +
              answeredCount +
              " / " +
              activeTeamCount +
              " answered";


            if (
              activeTeamCount >
                0 &&

              answeredCount >=
                activeTeamCount &&

              !revealInProgress
            ) {

              revealInProgress =
                true;


              await revealCurrentQuestion(
                roomCode
              );

            }

          }
        );

    }



    /* ==========================================
       SCORE / REVEAL
    ========================================== */

    async function revealCurrentQuestion(
      roomCode
    ) {

      if (
        !roomCode
      ) {

        return;

      }


      try {

        const roomRef =
          ref(
            db,
            "rooms/" +
            roomCode
          );


        const snapshot =
          await get(
            roomRef
          );


        if (
          !snapshot.exists()
        ) {

          revealInProgress =
            false;


          return;

        }


        const room =
          snapshot.val();


        const questionNumber =
          Number(
            room.currentQuestion
          ) || 1;


        const questionKey =
          "q" +
          questionNumber;


        const question =
          questions.find(
            q =>
              q.id ===
              questionNumber
          );


        if (
          !question
        ) {

          revealInProgress =
            false;


          statusEl.textContent =
            "Question not found.";


          return;

        }


        const alreadyScored =
          room.scoredQuestions &&
          room.scoredQuestions[
            questionKey
          ] ===
            true;


        if (
          alreadyScored
        ) {

          await update(
            roomRef,
            {
              state:
                "reveal"
            }
          );


          return;

        }


        const teams =
          room.teams ||
          {};


        const answers =
          (
            room.answers &&
            room.answers[
              questionKey
            ]
          ) || {};


        const correctAnswer =
          question.correctAnswer;


        let moonPowerGain =
          0;


        const updates =
          {};


        for (
          const [
            teamKey,
            teamData
          ]
          of Object.entries(
            teams
          )
        ) {

          if (
            !teamData ||
            teamData.joined !==
              true
          ) {

            continue;

          }


          const teamAnswer =
            answers[
              teamKey
            ]
              ? answers[
                  teamKey
                ].answer
              : "";


          const isCorrect =
            teamAnswer ===
            correctAnswer;


          const points =
            isCorrect
              ? 50
              : 0;


          const oldQuizScore =
            Number(
              teamData.quizScore
            ) || 0;


          const newQuizScore =
            oldQuizScore +
            points;


          moonPowerGain +=
            points;


          updates[
            "teams/" +
            teamKey +
            "/quizScore"
          ] =
            newQuizScore;


          updates[
            "results/" +
            questionKey +
            "/" +
            teamKey
          ] = {

            answer:
              teamAnswer,

            correct:
              isCorrect,

            points:
              points,

            quizScore:
              newQuizScore

          };

        }


        const currentMoonPower =
          Number(
            room.moonPower
          ) || 0;


        const targetMoonPower =
          Number(
            room.targetMoonPower
          ) || 1500;


        const newMoonPower =
          currentMoonPower +
          moonPowerGain;


        const wasAlreadyComplete =
          room.moonPowerComplete ===
            true ||
          currentMoonPower >=
            targetMoonPower;


        const isNowComplete =
          wasAlreadyComplete ||
          newMoonPower >=
            targetMoonPower;


        const justReachedTarget =
          !wasAlreadyComplete &&
          newMoonPower >=
            targetMoonPower;


        updates[
          "moonPower"
        ] =
          newMoonPower;


        updates[
          "lastQuestionGain"
        ] =
          moonPowerGain;


        updates[
          "moonPowerComplete"
        ] =
          isNowComplete;


        if (
          justReachedTarget
        ) {

          updates[
            "moonPowerReachedAtQuestion"
          ] =
            questionNumber;


          updates[
            "moonPowerReachedAt"
          ] =
            Date.now();

        }


        updates[
          "scoredQuestions/" +
          questionKey
        ] =
          true;


        updates[
          "state"
        ] =
          "reveal";


        await update(
          roomRef,
          updates
        );


      } catch (
        error
      ) {

        console.error(
          error
        );


        revealInProgress =
          false;


        statusEl.textContent =
          "Could not reveal answer: " +
          error.message;

      }

    }



    /* ==========================================
       MANUAL REVEAL
    ========================================== */

    revealButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode ||
          currentGameState !==
            "questions"
        ) {

          return;

        }


        revealInProgress =
          true;


        revealButton.disabled =
          true;


        await revealCurrentQuestion(
          currentRoomCode
        );

      }
    );



    /* ==========================================
       NEXT QUESTION
    ========================================== */

    nextQuestionButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode ||
          currentGameState !==
            "reveal"
        ) {

          return;

        }


        nextQuestionButton.disabled =
          true;


        finishQuizButton.disabled =
          true;


        try {

          const roomRef =
            ref(
              db,
              "rooms/" +
              currentRoomCode
            );


          const snapshot =
            await get(
              roomRef
            );


          if (
            !snapshot.exists()
          ) {

            return;

          }


          const room =
            snapshot.val();


          const currentQuestion =
            Number(
              room.currentQuestion
            ) || 1;


          const nextQuestion =
            currentQuestion +
            1;


          const nextQuestionExists =
            questions.some(
              q =>
                q.id ===
                nextQuestion
            );


          if (
            !nextQuestionExists
          ) {

            finishQuizButton.disabled =
              false;


            return;

          }


          revealInProgress =
            false;


          await update(
            roomRef,
            {
              state:
                "questions",

              currentQuestion:
                nextQuestion,

              lastQuestionGain:
                0
            }
          );


        } catch (
          error
        ) {

          console.error(
            error
          );


          statusEl.textContent =
            "Could not start next question: " +
            error.message;

        }

      }
    );



    /* ==========================================
       FINISH QUIZ
    ========================================== */

    finishQuizButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode ||
          currentGameState !==
            "reveal"
        ) {

          return;

        }


        finishQuizButton.disabled =
          true;


        nextQuestionButton.disabled =
          true;


        try {

          const roomRef =
            ref(
              db,
              "rooms/" +
              currentRoomCode
            );


          const snapshot =
            await get(
              roomRef
            );


          if (
            !snapshot.exists()
          ) {

            return;

          }


          const room =
            snapshot.val();


          const rawMoonPower =
            Number(
              room.moonPower
            ) || 0;


          const targetMoonPower =
            Number(
              room.targetMoonPower
            ) || 1500;


          const questionNumber =
            Number(
              room.currentQuestion
            ) || 1;


          const isLastQuestion =
            questionNumber >=
            questions.length;


          const naturallyComplete =
            room.moonPowerComplete ===
              true ||
            rawMoonPower >=
              targetMoonPower;


          if (
            !naturallyComplete &&
            !isLastQuestion
          ) {

            statusEl.textContent =
              "Moon Power has not reached the target yet.";


            return;

          }


          const completedByHost =
            !naturallyComplete;


          const completionReason =
            naturallyComplete
              ? "targetReached"
              : "allQuestionsFinished";


          await update(
            roomRef,
            {
              state:
                "quizComplete",

              quizCompleted:
                true,

              quizCompletedAt:
                Date.now(),

              moonPowerComplete:
                true,

              moonPowerCompletedByHost:
                completedByHost,

              rawMoonPowerAtQuizComplete:
                rawMoonPower,

              completionReason:
                completionReason
            }
          );


        } catch (
          error
        ) {

          console.error(
            error
          );


          finishQuizButton.disabled =
            false;


          statusEl.textContent =
            "Could not finish quiz: " +
            error.message;

        }

      }
    );



    /* ==========================================
       START FINAL LEADERBOARD
    ========================================== */

    startLeaderboardButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode ||
          currentGameState !==
            "quizComplete"
        ) {

          return;

        }


        startLeaderboardButton.disabled =
          true;


        try {

          const roomRef =
            ref(
              db,
              "rooms/" +
              currentRoomCode
            );


          const snapshot =
            await get(
              roomRef
            );


          if (
            !snapshot.exists()
          ) {

            return;

          }


          const room =
            snapshot.val();


          const teams =
            room.teams ||
            {};


          const standings =
            [];


          for (
            const [
              teamKey,
              teamData
            ]
            of Object.entries(
              teams
            )
          ) {

            if (
              !teamData ||
              teamData.joined !==
                true
            ) {

              continue;

            }


            const teamNumber =
              Number(
                teamKey.replace(
                  "team",
                  ""
                )
              );


            const previousScore =
              Number(
                teamData.previousScore
              ) || 0;


            const quizScore =
              Number(
                teamData.quizScore
              ) || 0;


            const totalScore =
              previousScore +
              quizScore;


            standings.push(
              {
                teamKey:
                  teamKey,

                teamNumber:
                  teamNumber,

                previousScore:
                  previousScore,

                quizScore:
                  quizScore,

                totalScore:
                  totalScore
              }
            );

          }


          if (
            standings.length === 0
          ) {

            statusEl.textContent =
              "No active teams found.";


            startLeaderboardButton.disabled =
              false;


            return;

          }


          standings.sort(
            (
              a,
              b
            ) => {

              if (
                b.totalScore !==
                a.totalScore
              ) {

                return (
                  b.totalScore -
                  a.totalScore
                );

              }


              return (
                a.teamNumber -
                b.teamNumber
              );

            }
          );


          let lastScore =
            null;


          let lastRank =
            0;


          standings.forEach(
            (
              team,
              index
            ) => {

              if (
                lastScore ===
                  null ||
                team.totalScore !==
                  lastScore
              ) {

                lastRank =
                  index + 1;


                lastScore =
                  team.totalScore;

              }


              team.rank =
                lastRank;

            }
          );


          const finalStandings =
            {};


          standings.forEach(
            team => {

              finalStandings[
                team.teamKey
              ] = {

                teamNumber:
                  team.teamNumber,

                previousScore:
                  team.previousScore,

                quizScore:
                  team.quizScore,

                totalScore:
                  team.totalScore,

                rank:
                  team.rank

              };

            }
          );


          const revealOrder =
            [
              ...new Set(
                standings.map(
                  team =>
                    team.rank
                )
              )
            ]
            .sort(
              (
                a,
                b
              ) =>
                b - a
            );


          await update(
            roomRef,
            {
              state:
                "leaderboard",

              finalStandings:
                finalStandings,

              leaderboardRevealOrder:
                revealOrder,

              leaderboardStep:
                0,

              leaderboardStartedAt:
                Date.now()
            }
          );


        } catch (
          error
        ) {

          console.error(
            error
          );


          startLeaderboardButton.disabled =
            false;


          statusEl.textContent =
            "Could not start leaderboard: " +
            error.message;

        }

      }
    );



    /* ==========================================
       REVEAL NEXT RANK
    ========================================== */

    revealRankButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode ||
          currentGameState !==
            "leaderboard"
        ) {

          return;

        }


        revealRankButton.disabled =
          true;


        try {

          const roomRef =
            ref(
              db,
              "rooms/" +
              currentRoomCode
            );


          const snapshot =
            await get(
              roomRef
            );


          if (
            !snapshot.exists()
          ) {

            return;

          }


          const room =
            snapshot.val();


          let revealOrder =
            room.leaderboardRevealOrder ||
            [];


          /*
            Firebase may return an
            array-like object.
          */

          if (
            !Array.isArray(
              revealOrder
            ) &&
            typeof revealOrder ===
              "object"
          ) {

            revealOrder =
              Object.keys(
                revealOrder
              )
              .sort(
                (
                  a,
                  b
                ) =>
                  Number(a) -
                  Number(b)
              )
              .map(
                key =>
                  revealOrder[key]
              );

          }


          const step =
            Number(
              room.leaderboardStep
            ) || 0;


          if (
            step >=
            revealOrder.length
          ) {

            revealRankButton.disabled =
              true;


            showFullLeaderboardButton.disabled =
              false;


            return;

          }


          const rankToReveal =
            Number(
              revealOrder[
                step
              ]
            );


          await update(
            roomRef,
            {
              leaderboardStep:
                step + 1,

              leaderboardCurrentRank:
                rankToReveal,

              leaderboardLastRevealAt:
                Date.now()
            }
          );


        } catch (
          error
        ) {

          console.error(
            error
          );


          revealRankButton.disabled =
            false;


          statusEl.textContent =
            "Could not reveal next rank: " +
            error.message;

        }

      }
    );



    /* ==========================================
       SHOW FULL LEADERBOARD
    ========================================== */

    showFullLeaderboardButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode ||
          currentGameState !==
            "leaderboard"
        ) {

          return;

        }


        showFullLeaderboardButton.disabled =
          true;


        try {

          await update(
            ref(
              db,
              "rooms/" +
              currentRoomCode
            ),
            {
              state:
                "leaderboardFull",

              leaderboardCompletedAt:
                Date.now()
            }
          );


        } catch (
          error
        ) {

          console.error(
            error
          );


          showFullLeaderboardButton.disabled =
            false;


          statusEl.textContent =
            "Could not show full leaderboard: " +
            error.message;

        }

      }
    );



    /* ==========================================
       PLAY FINALE
    ========================================== */

    playFinaleButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode ||
          currentGameState !==
            "leaderboardFull"
        ) {

          return;

        }


        playFinaleButton.disabled =
          true;


        playFinaleButton.textContent =
          "Starting Finale...";


        try {

          await update(
            ref(
              db,
              "rooms/" +
              currentRoomCode
            ),
            {
              state:
                "finale",

              finaleStartedAt:
                Date.now()
            }
          );


        } catch (
          error
        ) {

          console.error(
            error
          );


          playFinaleButton.disabled =
            false;


          playFinaleButton.textContent =
            "▶ Play Finale";


          statusEl.textContent =
            "Could not start finale: " +
            error.message;

        }

      }
    );



    /* ==========================================
       RENDER TEAM LIST
    ========================================== */

    async function renderTeams(
      teams
    ) {

      teamList.innerHTML =
        "";


      let joinedCount =
        0;


      for (
        let teamNumber = 1;
        teamNumber <= 10;
        teamNumber++
      ) {

        const teamKey =
          "team" +
          teamNumber;


        const teamData =
          teams[
            teamKey
          ] || {};


        const joined =
          teamData.joined ===
            true;


        if (
          joined
        ) {

          joinedCount++;

        }


        const row =
          document.createElement(
            "div"
          );


        row.className =
          "teamRow";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "teamName";


        name.textContent =
          "Team " +
          teamNumber;


        const connectionStatus =
          document.createElement(
            "div"
          );


        connectionStatus.textContent =
          joined
            ? "● Connected"
            : "○ Waiting";


        connectionStatus.className =
          joined
            ? "statusJoined"
            : "statusWaiting";


        const scoreArea =
          document.createElement(
            "div"
          );


        if (
          joined
        ) {

          const input =
            document.createElement(
              "input"
            );


          input.type =
            "number";


          input.min =
            "0";


          input.step =
            "1";


          input.placeholder =
            "Previous score";


          input.value =
            teamData.previousScore ??
            0;


          input.addEventListener(
            "change",
            async () => {

              const score =
                Math.max(
                  0,
                  Number(
                    input.value
                  ) || 0
                );


              await update(
                ref(
                  db,
                  "rooms/" +
                  currentRoomCode +
                  "/teams/" +
                  teamKey
                ),
                {
                  previousScore:
                    score
                }
              );

            }
          );


          scoreArea.appendChild(
            input
          );


        } else {

          scoreArea.textContent =
            "—";

        }


        const photoArea =
          document.createElement(
            "div"
          );


        photoArea.className =
          "photoArea";


        if (
          joined
        ) {

          const photoStorageKey =
            currentRoomCode +
            "-" +
            teamKey;


          const fileInput =
            document.createElement(
              "input"
            );


          fileInput.type =
            "file";


          fileInput.accept =
            "image/*";


          fileInput.hidden =
            true;


          const chooseButton =
            document.createElement(
              "button"
            );


          chooseButton.type =
            "button";


          chooseButton.className =
            "photoButton";


          chooseButton.textContent =
            "Choose Photo";


          const preview =
            document.createElement(
              "img"
            );


          preview.className =
            "photoPreview";


          preview.alt =
            "Team " +
            teamNumber +
            " photo";


          preview.hidden =
            true;


          const photoStatus =
            document.createElement(
              "span"
            );


          photoStatus.className =
            "photoStatus";


          chooseButton.addEventListener(
            "click",
            () => {

              fileInput.click();

            }
          );


          fileInput.addEventListener(
            "change",
            async () => {

              const file =
                fileInput.files[
                  0
                ];


              if (
                !file
              ) {

                return;

              }


              if (
                !file.type.startsWith(
                  "image/"
                )
              ) {

                alert(
                  "Please choose an image file."
                );


                return;

              }


              try {

                await saveTeamPhoto(
                  photoStorageKey,
                  file
                );


                photoChannel.postMessage(
                  {
                    type:
                      "photo-updated",

                    roomCode:
                      currentRoomCode,

                    teamKey:
                      teamKey
                  }
                );


                const previewURL =
                  URL.createObjectURL(
                    file
                  );


                preview.src =
                  previewURL;


                preview.hidden =
                  false;


                photoStatus.textContent =
                  "✓ Photo stored locally";


                chooseButton.textContent =
                  "Change Photo";


              } catch (
                error
              ) {

                console.error(
                  error
                );


                photoStatus.textContent =
                  "Photo could not be saved.";

              }

            }
          );


          try {

            const savedPhoto =
              await getTeamPhoto(
                photoStorageKey
              );


            if (
              savedPhoto
            ) {

              const savedURL =
                URL.createObjectURL(
                  savedPhoto
                );


              preview.src =
                savedURL;


              preview.hidden =
                false;


              photoStatus.textContent =
                "✓ Photo stored locally";


              chooseButton.textContent =
                "Change Photo";

            }


          } catch (
            error
          ) {

            console.error(
              "Could not load stored photo:",
              error
            );

          }


          photoArea.appendChild(
            chooseButton
          );


          photoArea.appendChild(
            fileInput
          );


          photoArea.appendChild(
            preview
          );


          photoArea.appendChild(
            photoStatus
          );


        } else {

          photoArea.textContent =
            "—";

        }


        row.appendChild(
          name
        );


        row.appendChild(
          connectionStatus
        );


        row.appendChild(
          scoreArea
        );


        row.appendChild(
          photoArea
        );


        teamList.appendChild(
          row
        );

      }


      currentJoinedCount =
        joinedCount;


      joinedCountEl.textContent =
        joinedCount +
        " / 10 teams joined";


      updatePrimaryButtons();


      if (
        currentGameState ===
          "lobby" ||
        currentGameState ===
          "none"
      ) {

        if (
          joinedCount ===
            10
        ) {

          statusEl.textContent =
            "✅ All 10 teams are ready.";


        } else {

          statusEl.textContent =
            joinedCount +
            " team(s) currently connected.";

        }

      }

    }



    /* ==========================================
       PLAY INTRO
    ========================================== */

    playIntroButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode
        ) {

          return;

        }


        await update(
          ref(
            db,
            "rooms/" +
            currentRoomCode
          ),
          {
            state:
              "intro"
          }
        );

      }
    );



    /* ==========================================
       START QUESTIONS
    ========================================== */

    startButton.addEventListener(
      "click",
      async () => {

        if (
          !currentRoomCode
        ) {

          return;

        }


        if (
          questions.length ===
            0
        ) {

          return;

        }


        revealInProgress =
          false;


        await update(
          ref(
            db,
            "rooms/" +
            currentRoomCode
          ),
          {
            state:
              "questions",

            currentQuestion:
              questions[
                0
              ].id
          }
        );

      }
    );



    /* ==========================================
       RESET
    ========================================== */

    resetRoomButton.addEventListener(
      "click",
      async () => {

        const confirmed =
          confirm(
            "End the current game and return the TV to the waiting screen?"
          );


        if (
          !confirmed
        ) {

          return;

        }


        try {

          await set(
            ref(
              db,
              "currentRoom"
            ),
            null
          );


          stopExistingListeners();


          currentRoomCode =
            null;


          currentGameState =
            "none";


          currentJoinedCount =
            0;


          revealInProgress =
            false;


          roomSection.hidden =
            true;


          roomCodeEl.textContent =
            "----";


          joinedCountEl.textContent =
            "0 / 10 teams joined";


          teamList.innerHTML =
            "";


          playIntroButton.disabled =
            true;


          startButton.disabled =
            true;


          revealButton.disabled =
            true;


          nextQuestionButton.disabled =
            true;


          finishQuizButton.disabled =
            true;


          resetLeaderboardButtons();


          playFinaleButton.textContent =
            "▶ Play Finale";


          statusEl.textContent =
            "Current game ended. Ready to create a new room.";


        } catch (
          error
        ) {

          console.error(
            error
          );


          statusEl.textContent =
            "❌ Error: " +
            error.message;

        }

      }
    );

  </script>

</body>
</html>
