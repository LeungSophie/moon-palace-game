<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Moon Palace Team</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #11152b;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    input {
      width: 180px;
      font-size: 28px;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin: 15px 0;
      letter-spacing: 6px;
    }

    .mainButton {
      font-size: 20px;
      padding: 14px 20px;
      border-radius: 10px;
      border: none;
    }

    #teamGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .teamButton {
      min-height: 70px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
    }

    .available {
      background: white;
      color: #11152b;
    }

    .taken {
      background: #555;
      color: #bbb;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      font-size: 18px;
      line-height: 1.4;
    }

    .teamIdentity {
      font-size: 40px;
      font-weight: bold;
      margin: 20px 0;
      color: #ffe89a;
    }

    #waitingMessage {
      font-size: 22px;
      line-height: 1.5;
      margin-top: 25px;
    }

    /* ANSWER SCREEN */

    #questionLabel {
      font-size: 20px;
      opacity: 0.8;
      margin-top: 8px;
    }

    #answerInstruction {
      font-size: 22px;
      margin: 18px 0 22px;
    }

    #answerGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      max-width: 520px;
      margin: 0 auto;
    }

    .answerButton {
      min-height: 125px;
      border: none;
      border-radius: 18px;
      color: white;
      font-size: 50px;
      font-weight: bold;
      transition:
        transform 0.12s ease,
        opacity 0.2s ease;
    }

    #answerA {
      background: #d84a4a;
    }

    #answerB {
      background: #3978d4;
    }

    #answerC {
      background: #d49a27;
    }

    #answerD {
      background: #3a9b61;
    }

    .answerButton:active:not(:disabled) {
      transform: scale(0.97);
    }

    .answerButton:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .answerButton.selected {
      opacity: 1;
      outline: 5px solid white;
    }

    #submittedPanel {
      margin-top: 28px;
      font-size: 22px;
      line-height: 1.5;
    }

    #submittedAnswer {
      font-size: 46px;
      font-weight: bold;
      color: #ffe89a;
      margin: 10px 0;
    }

    #lookAtTV {
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- =========================
       ENTER ROOM
  ========================== -->

  <section id="joinSection">

    <h1>🌙 Moon Palace Adventure</h1>

    <p>Enter Room Code</p>

    <input
      id="roomCodeInput"
      type="text"
      inputmode="numeric"
      maxlength="4"
      placeholder="0000"
    >

    <br>

    <button
      id="joinRoomButton"
      class="mainButton"
    >
      Join Room
    </button>

    <p id="status"></p>

  </section>


  <!-- =========================
       CHOOSE TEAM
  ========================== -->

  <section
    id="teamSection"
    hidden
  >

    <h1>Choose Your Team</h1>

    <p id="roomDisplay"></p>

    <div id="teamGrid"></div>

  </section>


  <!-- =========================
       WAITING / INTRO
  ========================== -->

  <section
    id="waitingSection"
    hidden
  >

    <h1>🌙 Connected</h1>

    <div
      id="waitingTeamName"
      class="teamIdentity"
    ></div>

    <div id="waitingMessage">
      Waiting for the host to start the adventure...
    </div>

  </section>


  <!-- =========================
       ANSWER SCREEN
  ========================== -->

  <section
    id="answerSection"
    hidden
  >

    <div
      id="answerTeamName"
      class="teamIdentity"
    ></div>

    <div id="questionLabel">
      QUESTION 1
    </div>

    <div id="answerInstruction">
      Look at the TV and choose your answer
      <br>
      請看大螢幕並選擇答案
    </div>


    <div id="answerGrid">

      <button
        class="answerButton"
        id="answerA"
        data-answer="A"
      >
        A
      </button>

      <button
        class="answerButton"
        id="answerB"
        data-answer="B"
      >
        B
      </button>

      <button
        class="answerButton"
        id="answerC"
        data-answer="C"
      >
        C
      </button>

      <button
        class="answerButton"
        id="answerD"
        data-answer="D"
      >
        D
      </button>

    </div>


    <div
      id="submittedPanel"
      hidden
    >

      Answer submitted

      <div id="submittedAnswer"></div>

      <div id="lookAtTV">
        👆 Look at the TV
        <br>
        請看大螢幕
      </div>

    </div>

  </section>


  <script type="module">

    import {
      db,
      ref,
      get,
      set,
      onValue
    } from "./firebase.js";


    const joinSection =
      document.getElementById(
        "joinSection"
      );

    const teamSection =
      document.getElementById(
        "teamSection"
      );

    const waitingSection =
      document.getElementById(
        "waitingSection"
      );

    const answerSection =
      document.getElementById(
        "answerSection"
      );


    const roomCodeInput =
      document.getElementById(
        "roomCodeInput"
      );

    const joinRoomButton =
      document.getElementById(
        "joinRoomButton"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const roomDisplay =
      document.getElementById(
        "roomDisplay"
      );

    const teamGrid =
      document.getElementById(
        "teamGrid"
      );


    const waitingTeamName =
      document.getElementById(
        "waitingTeamName"
      );

    const waitingMessage =
      document.getElementById(
        "waitingMessage"
      );


    const answerTeamName =
      document.getElementById(
        "answerTeamName"
      );

    const questionLabel =
      document.getElementById(
        "questionLabel"
      );

    const submittedPanel =
      document.getElementById(
        "submittedPanel"
      );

    const submittedAnswer =
      document.getElementById(
        "submittedAnswer"
      );


    const answerButtons =
      document.querySelectorAll(
        ".answerButton"
      );


    let currentRoomCode =
      null;

    let selectedTeamNumber =
      null;

    let selectedTeamKey =
      null;

    let currentQuestionNumber =
      0;

    let submittedThisQuestion =
      false;


    /* =========================
       JOIN ROOM
    ========================== */

    joinRoomButton.addEventListener(
      "click",
      async () => {

        const roomCode =
          roomCodeInput.value.trim();


        if (
          !/^\d{4}$/.test(
            roomCode
          )
        ) {

          statusEl.textContent =
            "Please enter a valid 4-digit room code.";

          return;
        }


        statusEl.textContent =
          "Checking room...";


        try {

          const roomSnapshot =
            await get(
              ref(
                db,
                "rooms/" +
                roomCode
              )
            );


          if (
            !roomSnapshot.exists()
          ) {

            statusEl.textContent =
              "Room not found.";

            return;
          }


          currentRoomCode =
            roomCode;


          joinSection.hidden =
            true;

          teamSection.hidden =
            false;


          roomDisplay.textContent =
            "Room " +
            roomCode;


          startWatchingTeams();


        } catch (error) {

          console.error(error);


          statusEl.textContent =
            "Error: " +
            error.message;

        }

      }
    );


    /* =========================
       TEAM AVAILABILITY
    ========================== */

    function startWatchingTeams() {

      const teamsRef =
        ref(
          db,
          "rooms/" +
          currentRoomCode +
          "/teams"
        );


      onValue(
        teamsRef,
        (snapshot) => {

          const teams =
            snapshot.val() || {};


          if (
            selectedTeamNumber === null
          ) {

            renderTeams(
              teams
            );

          }

        }
      );
    }


    function renderTeams(
      teams
    ) {

      teamGrid.innerHTML =
        "";


      for (
        let teamNumber = 1;
        teamNumber <= 10;
        teamNumber++
      ) {

        const teamKey =
          "team" +
          teamNumber;


        const isTaken =
          teams[teamKey] &&
          teams[teamKey]
            .joined === true;


        const button =
          document.createElement(
            "button"
          );


        button.className =
          "teamButton";


        if (isTaken) {

          button.textContent =
            "Team " +
            teamNumber +
            " — Taken";


          button.classList.add(
            "taken"
          );


          button.disabled =
            true;

        } else {

          button.textContent =
            "Team " +
            teamNumber;


          button.classList.add(
            "available"
          );


          button.addEventListener(
            "click",
            () => {
              claimTeam(
                teamNumber
              );
            }
          );

        }


        teamGrid.appendChild(
          button
        );

      }

    }


    /* =========================
       CLAIM TEAM
    ========================== */

    async function claimTeam(
      teamNumber
    ) {

      if (
        !currentRoomCode ||
        selectedTeamNumber !== null
      ) {
        return;
      }


      const teamKey =
        "team" +
        teamNumber;


      const teamRef =
        ref(
          db,
          "rooms/" +
          currentRoomCode +
          "/teams/" +
          teamKey
        );


      try {

        const snapshot =
          await get(
            teamRef
          );


        if (
          snapshot.exists() &&
          snapshot.val().joined === true
        ) {

          alert(
            "That team has already been taken. Please choose another team."
          );

          return;
        }


        await set(
          teamRef,
          {
            joined: true,
            joinedAt: Date.now(),
            quizScore: 0,
            previousScore: 0
          }
        );


        selectedTeamNumber =
          teamNumber;

        selectedTeamKey =
          teamKey;


        teamSection.hidden =
          true;

        waitingSection.hidden =
          false;


        waitingTeamName.textContent =
          "TEAM " +
          teamNumber;


        answerTeamName.textContent =
          "TEAM " +
          teamNumber;


        startWatchingRoom();


      } catch (error) {

        console.error(error);


        alert(
          "Unable to claim team: " +
          error.message
        );

      }

    }


    /* =========================
       WATCH GAME STATE
    ========================== */

    function startWatchingRoom() {

      const roomRef =
        ref(
          db,
          "rooms/" +
          currentRoomCode
        );


      onValue(
        roomRef,
        async (snapshot) => {

          const room =
            snapshot.val();


          if (!room) {
            return;
          }


          const state =
            room.state ||
            "lobby";


          if (
            state === "lobby"
          ) {

            showWaitingScreen(
              "Waiting for the host to start the adventure..."
            );

            return;
          }


          if (
            state === "intro"
          ) {

            showWaitingScreen(
              "Watch the TV — the adventure is beginning! 🌙"
            );

            return;
          }


          if (
            state === "questions"
          ) {

            const questionNumber =
              room.currentQuestion || 1;


            await showQuestion(
              questionNumber
            );

          }

        }
      );

    }


    /* =========================
       WAITING SCREEN
    ========================== */

    function showWaitingScreen(
      message
    ) {

      answerSection.hidden =
        true;

      waitingSection.hidden =
        false;


      waitingMessage.textContent =
        message;

    }


    /* =========================
       SHOW QUESTION
    ========================== */

    async function showQuestion(
      questionNumber
    ) {

      waitingSection.hidden =
        true;

      answerSection.hidden =
        false;


      questionLabel.textContent =
        "QUESTION " +
        questionNumber +
        " / 10";


      /*
        If this is a different
        question, reset the phone.
      */

      if (
        currentQuestionNumber !==
        questionNumber
      ) {

        currentQuestionNumber =
          questionNumber;

        submittedThisQuestion =
          false;


        resetAnswerButtons();


        submittedPanel.hidden =
          true;


        /*
          Check whether this team
          already submitted an answer
          for this question.
          This also helps if the page
          briefly reconnects.
        */

        const answerSnapshot =
          await get(
            ref(
              db,
              "rooms/" +
              currentRoomCode +
              "/answers/q" +
              questionNumber +
              "/" +
              selectedTeamKey
            )
          );


        if (
          answerSnapshot.exists()
        ) {

          const previousAnswer =
            answerSnapshot.val()
              .answer;


          showSubmittedState(
            previousAnswer
          );

        }

      }

    }


    /* =========================
       ANSWER BUTTONS
    ========================== */

    answerButtons.forEach(
      (button) => {

        button.addEventListener(
          "click",
          async () => {

            if (
              submittedThisQuestion ||
              !currentRoomCode ||
              !selectedTeamKey ||
              currentQuestionNumber <= 0
            ) {
              return;
            }


            const answer =
              button.dataset.answer;


            /*
              Lock immediately so
              double tapping cannot
              submit twice.
            */

            submittedThisQuestion =
              true;


            lockAnswerButtons(
              answer
            );


            try {

              await set(
                ref(
                  db,
                  "rooms/" +
                  currentRoomCode +
                  "/answers/q" +
                  currentQuestionNumber +
                  "/" +
                  selectedTeamKey
                ),
                {
                  answer: answer,
                  submittedAt:
                    Date.now()
                }
              );


              showSubmittedState(
                answer
              );


            } catch (error) {

              console.error(error);


              submittedThisQuestion =
                false;


              resetAnswerButtons();


              alert(
                "Your answer could not be submitted. Please try again."
              );

            }

          }
        );

      }
    );


    /* =========================
       BUTTON STATES
    ========================== */

    function lockAnswerButtons(
      selectedAnswer
    ) {

      answerButtons.forEach(
        (button) => {

          button.disabled =
            true;


          if (
            button.dataset.answer ===
            selectedAnswer
          ) {

            button.classList.add(
              "selected"
            );

          }

        }
      );

    }


    function resetAnswerButtons() {

      answerButtons.forEach(
        (button) => {

          button.disabled =
            false;


          button.classList.remove(
            "selected"
          );

        }
      );

    }


    function showSubmittedState(
      answer
    ) {

      submittedThisQuestion =
        true;


      lockAnswerButtons(
        answer
      );


      submittedAnswer.textContent =
        answer;


      submittedPanel.hidden =
        false;

    }

  </script>

</body>
</html>
